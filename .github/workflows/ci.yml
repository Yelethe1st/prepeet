# Continuous integration.
#
# PLT-02: the invariants become enforceable here. A change that breaks a
# contract, crosses a module boundary, drops coverage or fails a lint is
# rejected by the pipeline rather than by a reviewer noticing.
#
# The three deployables run as separate jobs so a failure names which one broke,
# and so they run in parallel.
#
# Lint and format steps invoke the make targets an engineer runs locally rather
# than reimplementing the commands. That is not tidiness. This file previously
# spelled out its own equivalents, and the web job's version omitted `pnpm lint`
# entirely, so ESLint never ran here. It had also never run locally, because the
# script called `next lint`, which Next 16 removed and no configuration existed
# for. Two copies of a check are two chances for one of them to stop being run,
# and the copy that is not run is the one nobody notices.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - name: Lint, format and vet
        run: make lint-go
        working-directory: .
      - name: Build every binary
        run: go build ./...
      # Coverage runs with the integration tag so the storage adapter is
      # measured by the tests that exercise it. Without the tag it reads as
      # untested, which is both wrong and the kind of number that invites
      # lowering the floor. Testcontainers starts LocalStack, which the runner
      # has Docker for.
      - name: Test with the race detector and coverage
        run: go test -tags integration -race -timeout 15m -covermode=atomic -coverprofile=coverage.out ./platform/... ./internal/...
      # Their own modules, so the step above does not reach them. Uncached,
      # because their inputs are the contracts and the documentation and the
      # cache cannot see those change.
      - name: Test the generators
        run: make test-tools
        working-directory: .
      # Generated packages are stripped first: none of them can hold a test
      # of their own, so they read 0% however well the stores above them are
      # exercised. The script says the rest, and both this job and `make
      # cover-go` call it rather than each spelling out its own filter.
      - name: Enforce the coverage floor
        run: |
          total=$("$GITHUB_WORKSPACE/tools/coverage/handwritten.sh" coverage.out)
          # Absolute path: this step runs from services/platform, and a relative
          # path here failed once when the script was not in the checkout at all.
          "$GITHUB_WORKSPACE/tools/coverage/check.sh" go "$total" 80

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/platform/go.mod
          cache-dependency-path: services/platform/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # check-generated regenerates everything, and the Python gRPC stub step
      # runs through uv, so this job needs it even though it tests nothing.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install the Python toolchain
        run: cd services/intelligence && uv sync --all-extras
      - name: Lint the OpenAPI document
        run: make lint-contracts
      # ADR-0004 makes the contract the source and generates everything else
      # from it. That only holds if regenerating produces what is committed, so
      # a drift here fails the build rather than being noticed later.
      - name: Generated code matches the contracts
        run: make check-generated
      # Tags are needed to find the previous release, and actions/checkout
      # fetches none by default, which would make this silently skip.
      - name: Fetch tags for the compatibility baseline
        run: git fetch --tags --depth=1
      - name: Refuse a breaking change to the event contracts
        run: make check-events
      - name: Refuse a breaking change to the RPC contracts
        run: make check-rpc
      # Nothing imports the RPC stubs yet, so building the module is the only
      # thing proving they compile, which is CTR-02's first criterion.
      - name: Build the generated Go stubs
        run: cd packages/generated/go && go build ./...

  python:
    name: Python intelligence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras
      - name: Lint, format and type check
        run: make lint-py
        working-directory: .
      - name: Test and enforce the coverage floor
        run: uv run pytest --cov=prepeet_ai --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint and type check
        run: make lint-web
        working-directory: .
      - name: Test and enforce the coverage floor
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  browser:
    name: Web application in a browser
    runs-on: ubuntu-latest
    # The image Playwright's own baselines were generated in. Running the
    # browser from the runner's own packages instead would render text
    # differently from the committed screenshots, and every appearance test
    # would fail for a reason that has nothing to do with the change.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Accessibility, layout and appearance
        run: pnpm test:browser
      # The report is what makes a failure diagnosable without rerunning it
      # locally: it carries the diff image for an appearance failure and a trace
      # for anything else.
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every internal documentation link resolves
        run: |
          broken=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              case "$link" in http*|\#*) continue;; esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "broken: $file -> $link"
                broken=1
              fi
            done < <(grep -o ']([^)]*)' "$file" | sed 's/](//;s/)$//')
          done < <(find docs screens/docs -name '*.md')
          exit $broken
