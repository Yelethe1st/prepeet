# Local development stack.
#
# PLT-01 requires a new engineer to run the whole product from one documented
# command with no cloud account. ADR-0001 chooses AWS, so the local stack
# emulates AWS rather than approximating it.
#
# LocalStack rather than MinIO, measured rather than assumed. Running the object
# storage integration suite against both showed MinIO returning nothing from
# ListMultipartUploads, which makes the orphan reconciliation PLT-05 requires
# untestable, and MinIO accepting a CreateBucket without the location constraint
# that real S3 demands outside us-east-1. LocalStack caught both. It also
# provides Secrets Manager and KMS, which PLT-07 needs, so the alternative was
# two emulators whose behaviour could drift apart.
#
# MinIO is lighter and starts faster. That is the trade accepted here.
#
# Everything holds synthetic data only. Production data never seeds a lower
# environment, per docs/operations/deployment-topology.md.
#
# Every image is pinned. An unpinned tag means two engineers running this a
# month apart get different stacks, and a release that changes presigned URL
# behaviour would surface as an application bug. Bump these deliberately.
#
# Host ports are overridable, because a developer with a local PostgreSQL or
# anything else on these ports would otherwise be unable to start the stack at
# all. Copy `.env.example` to `.env` in this directory and change what clashes.
#
# Start with `make local-up`.

name: prepeet

services:
  postgres:
    image: postgres:17-alpine
    # Row-level security is the second line of tenant isolation, and it is only
    # meaningful if the application role cannot bypass it. The application
    # connects as a non-superuser role created by the migrations in PLT-03, not
    # as this bootstrap superuser.
    environment:
      POSTGRES_USER: prepeet
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: prepeet
    ports:
      - "${PREPEET_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepeet -d prepeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,secretsmanager,kms
      # Off by default, which would let an expired presigned URL keep working.
      # Local development should fail the same way production does.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      DEBUG: "0"
    ports:
      - "${PREPEET_LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal gets its own PostgreSQL, matching the deployed shape from ADR-0007
  # rather than approximating it.
  #
  # It shared the application's database until that ADR, and three things made
  # that wrong. Temporal manages its own schema with its own migration tool and
  # expects ordinary ownership, which collides with ADR-0002 forcing row-level
  # security on every table and giving the application a NOBYPASSRLS role. Its
  # write pattern is many small writes to few rows, which ADR-0006 already
  # identified as the one to keep off the primary. And its upgrades pin schema
  # versions, so sharing an instance couples its upgrade window to ours.
  #
  # Locally this costs one container. Sharing would have hidden all three until
  # they appeared in a deployed environment.
  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: local-development-only
      POSTGRES_SEEDS: temporal-postgres
      # One namespace per environment, per ADR-0007. The local worker connects
      # to prepeet-local and never to default, so a task queue name typed
      # correctly against the wrong namespace finds nothing rather than
      # something.
      DEFAULT_NAMESPACE: prepeet-local
      # Seven days outside production. Retention is set explicitly because a
      # default is a value nobody chose, and workflow history is
      # candidate-linked storage on its own schedule.
      DEFAULT_NAMESPACE_RETENTION: 168h
    ports:
      - "${PREPEET_TEMPORAL_PORT:-7233}:7233"
    # The namespace is named explicitly. The CLI defaults to `default`, which
    # this server does not create: DEFAULT_NAMESPACE above replaces it with
    # prepeet-local, per ADR-0007. Without this the healthcheck asks for a
    # namespace that does not exist and reports a working server as unhealthy.
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list",
             "--address", "temporal:7233", "--namespace", "prepeet-local"]
      interval: 10s
      timeout: 5s
      retries: 18

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: prepeet-local
    ports:
      - "${PREPEET_TEMPORAL_UI_PORT:-8233}:8080"
    # A healthcheck so `up --wait` waits for this to answer rather than only to
    # be running. Without it local-up returns and prints a URL that refuses the
    # connection for the next few seconds, which reads as a broken stack rather
    # than a slow one.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  temporal-postgres-data:
  localstack-data:
