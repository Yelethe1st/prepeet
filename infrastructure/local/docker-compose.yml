# Local development stack.
#
# PLT-01 requires a new engineer to run the whole product from one documented
# command with no cloud account. ADR-0001 chooses MinIO as the local stand-in
# for S3, so the object storage adapter is written once against the S3 API and
# differs only by endpoint and credentials between here and eu-west-2.
#
# Everything here holds synthetic data only. Production data never seeds a lower
# environment, per docs/operations/deployment-topology.md.
#
# Host ports are overridable, because a developer with a local PostgreSQL or
# anything else on these ports would otherwise be unable to start the stack at
# all. Copy `.env.example` to `.env` in this directory and change what clashes.
#
# Start with `make local-up`.

name: prepeet

services:
  postgres:
    image: postgres:17-alpine
    # Row-level security is the second line of tenant isolation, and it is only
    # meaningful if the application role cannot bypass it. The application
    # connects as a non-superuser role created by the migrations in PLT-03, not
    # as this bootstrap superuser.
    environment:
      POSTGRES_USER: prepeet
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: prepeet
    ports:
      - "${PREPEET_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepeet -d prepeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prepeet
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "${PREPEET_MINIO_PORT:-9000}:9000" # S3 API
      - "${PREPEET_MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Buckets are created here rather than by application code, because a service
  # that can create its own buckets needs credentials it should not hold in a
  # deployed environment.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 prepeet local-development-only &&
      mc mb --ignore-existing local/prepeet-media &&
      mc mb --ignore-existing local/prepeet-documents &&
      mc mb --ignore-existing local/prepeet-exports &&
      mc version enable local/prepeet-media &&
      echo 'buckets ready'
      "

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: prepeet
      POSTGRES_PWD: local-development-only
      POSTGRES_SEEDS: postgres
    ports:
      - "${PREPEET_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${PREPEET_TEMPORAL_UI_PORT:-8233}:8080"

volumes:
  postgres-data:
  minio-data:
