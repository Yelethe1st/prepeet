# The public API contract.
#
# This document is the source. The Go server interface and the TypeScript client
# are generated from it, and a handler that does not satisfy the generated
# interface does not compile. See ADR-0004.
#
# Written first rather than derived from code because much of what is here is a
# compliance obligation rather than an implementation detail: 404 where
# existence is sensitive, error codes that never change meaning, and idempotency
# that cannot bill an interview twice. Those need to be readable by legal and
# security in one artifact before a screening pilot.
openapi: 3.1.0

info:
  title: Prepeet API
  version: "1.0.0"
  description: |
    The browser talks to this API and to nothing else. It never reaches
    PostgreSQL, Temporal, object storage or the intelligence service directly,
    which is what keeps authorization decidable in one place.

    Every request operates under exactly one explicit active tenant. Tenant is
    never inferred from a resource identifier.
  contact:
    name: Prepeet engineering

servers:
  - url: /api/v1
    description: Version in the path. A new version is a project rather than a release.

tags:
  - name: health
    description: Deployment probes. Unauthenticated.
  - name: authentication
    description: Registration, login, logout and session refresh.
  - name: candidate
    description: The candidate's own data. Owner-scoped; no tenant authority reaches it.
  - name: catalog
    description: The interview catalogue - disciplines, roles, shapes and personas - served from the artifact registry, never hardcoded.
  - name: interview
    description: Interview sessions - creation from a validated catalogue selection; the lifecycle endpoints arrive with the session tickets.
  - name: tenant
    description: Workspace administration - members and roles. Every operation is decided by the capability catalogue, tenant-scoped, and audited.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Report whether the process is running
      description: |
        Deliberately ignores dependencies. If a failing database made this fail,
        the orchestrator would restart healthy processes during an outage and
        turn a degradation into an outage.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Report whether this process can serve traffic
      description: |
        503 tells a load balancer to route elsewhere without restarting
        anything. The response never carries a dependency's error detail, which
        routinely contains a host, a port and sometimes a credential.
      security: []
      responses:
        "200":
          description: Every dependency answered.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency did not answer.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /auth/register:
    post:
      tags: [authentication]
      operationId: register
      summary: Register a candidate or an organisation
      description: |
        Answers identically whether or not the address is already registered.
        Confirming an address here would let anyone enumerate who practises for
        interviews, which is information a candidate has not agreed to share.

        Registration never signs the user in. Verification comes first, and the
        response says only that the next step has been sent.
      security: []
      parameters:

        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: |
            Accepted. Returned whether the address was new or already known, so
            the response cannot be used to test for an account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [authentication]
      operationId: login
      summary: Exchange credentials for a session
      description: |
        A wrong password and an unregistered address produce the same response
        and take the same time, because timing leaks what a carefully worded
        body does not.

        On success the session and refresh tokens are set as HTTP-only,
        SameSite cookies rather than returned in the body, so no script in the
        page can read them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: |
            The credentials did not authenticate. Identical for an unknown
            address and a wrong password.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [authentication]
      operationId: logout
      summary: End the current session
      description: |
        Revokes the session and its refresh family, so a stolen refresh token
        cannot outlive the logout. Idempotent: logging out twice is not an error.
      responses:
        "204":
          description: The session is ended.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Expired session and refresh cookies.
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/refresh:
    post:
      tags: [authentication]
      operationId: refresh
      summary: Rotate the session using a refresh token
      description: |
        Each refresh issues a new pair and retires the old one. Presenting a
        retired token means either a stolen token or a client bug, and both are
        handled the same way: the whole session family is revoked and the event
        is audited. Being logged out is a cheap failure; an attacker keeping a
        foothold is not.
      security: []
      responses:
        "200":
          description: A new session was issued and the old one retired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Rotated session and refresh cookies.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: |
            The refresh token was missing, expired, or already used. A reused
            token also revokes the entire family.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email/request:
    post:
      tags: [authentication]
      operationId: requestTokenEmail
      summary: Send a verification, recovery, sign-in or code email
      description: |
        One request surface for the four token flows, distinguished by kind.
        Answers 202 identically for a known and an unknown address, because
        confirming which addresses hold accounts is the enumeration every
        response in this contract refuses.

        Resending is rate limited per address with a visible cooldown: the 429
        carries Retry-After and the same value in the body, so the interface
        can show a countdown rather than a bare refusal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenEmailRequest"
      responses:
        "202":
          description: |
            Accepted. If the address holds an account, an email is on its way;
            the response does not say whether it does.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEmailAccepted"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/ResendCoolingDown" }

  /auth/email/verify:
    post:
      tags: [authentication]
      operationId: confirmEmailVerification
      summary: Confirm an email address with a verification token
      description: |
        Consumes the single-use token from the verification email. Replaying a
        consumed token repeats nothing and earns TOKEN_USED, which the
        interface shows as "already done" rather than as a failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "204":
          description: The address is verified.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/password/reset:
    post:
      tags: [authentication]
      operationId: confirmPasswordReset
      summary: Set a new password with a recovery token
      description: |
        Consumes the single-use token from the recovery email and replaces the
        password. Every existing session is revoked in the same transaction,
        because the reset exists precisely when the old password may be in
        somebody else's hands.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: The password is changed and every session revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/magic/consume:
    post:
      tags: [authentication]
      operationId: consumeMagicLink
      summary: Sign in with a magic link token
      description: |
        Consumes the single-use token and issues a session in the same cookies
        login sets. Arriving here proves control of the address, so it is also
        marked verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/otp/consume:
    post:
      tags: [authentication]
      operationId: consumeOTP
      summary: Sign in with a one-time code
      description: |
        Exchanges the emailed six-digit code for a session. A wrong code and an
        unknown address answer identically, and the fifth wrong code kills the
        token: six digits survive guessing only because of the cap, and the
        person who asked for the code loses nothing but a resend.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPConsumeRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /me/profile:
    get:
      tags: [candidate]
      operationId: getProfile
      summary: Read the candidate's own profile
      description: |
        The profile is the candidate's alone; the session decides whose it is
        and there is no way to name anybody else's. A candidate who never
        saved gets the empty profile rather than an error, because a partial
        profile is usable and the first visit must not look broken.
      responses:
        "200":
          description: The profile, possibly empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [candidate]
      operationId: saveProfile
      summary: Replace the candidate's own profile
      description: |
        Whole-record replace: the profile is one screen, the screen submits
        what it shows, and field-level merges are where two tabs quietly
        assemble a profile neither displayed. Every field is optional;
        nothing is blocked behind completeness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfile"
      responses:
        "200":
          description: The profile as stored, after normalisation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/documents:
    get:
      tags: [candidate]
      operationId: listDocuments
      summary: List the candidate's own documents, every version and state
      description: |
        Newest first, states included: a stuck upload is visible beside the
        version that superseded it, and a deleted version's record stands
        because a session bundle may have pinned its digest.
      responses:
        "200":
          description: The document history.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [candidate]
      operationId: startDocumentUpload
      summary: Start a CV upload
      description: |
        Allocates the next version and returns presigned URLs the browser
        PUTs the bytes to directly; the server never proxies the file and the
        browser never holds a durable credential. Every upload is a new
        version - replacement is version n+1 existing, never version n
        changing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartUploadRequest"
      responses:
        "201":
          description: The upload, ready for the browser to carry the bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedUpload"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/documents/{documentId}/complete:
    post:
      tags: [candidate]
      operationId: completeDocumentUpload
      summary: Finalise an upload
      description: |
        The stored size is verified against what actually landed; the digest
        is recorded as the identity extraction and composition will pin.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: The stored document.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}/abort:
    post:
      tags: [candidate]
      operationId: abortDocumentUpload
      summary: Abandon a stalled upload
      description: |
        The multipart upload is discarded and the version reads failed,
        visibly - its own recoverable state, recovered by simply uploading
        again as the next version.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: The upload is abandoned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}:
    delete:
      tags: [candidate]
      operationId: deleteDocument
      summary: Delete a stored document
      description: |
        The bytes are destroyed; the version's record stands with its digest,
        because a session bundle composed from it must stay answerable.
        Deletion never rewrites a session composed from an earlier version.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: The object is deleted; the record remains.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}/facts:
    get:
      tags: [candidate]
      operationId: listDocumentFacts
      summary: List what extraction read from one document
      description: |
        Every fact carries the exact source span that produced it, its
        confidence, the extractor version and its review state. Unparsed text
        arrives as facts of kind unparsed rather than silently missing.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document's facts, in span order.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/facts/{factId}/review:
    post:
      tags: [candidate]
      operationId: reviewFact
      summary: Confirm, correct or reject one extracted fact
      description: |
        Correcting records the correction beside the original extraction,
        which is never rewritten; rejecting is a status, not a deletion.
        Downstream reads serve the correction and omit the rejected from the
        moment the review lands.
      parameters:
        - $ref: "#/components/parameters/FactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewFactRequest"
      responses:
        "200":
          description: The fact after the review.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fact"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/disciplines:
    get:
      tags: [catalog]
      operationId: listDisciplines
      summary: List the professions the product serves
      responses:
        "200":
          description: The disciplines.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/roles:
    get:
      tags: [catalog]
      operationId: listRoles
      summary: List catalogued roles with their valid combinations
      description: |
        Each role names its discipline and the interview shapes it offers,
        which is the combination rule the server enforces at composition. The
        browser may filter by these; the server never trusts that it did.
      responses:
        "200":
          description: The roles.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/interview-shapes:
    get:
      tags: [catalog]
      operationId: listInterviewShapes
      summary: List interview shapes with their runnable lengths
      responses:
        "200":
          description: The shapes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/personas:
    get:
      tags: [catalog]
      operationId: listPersonas
      summary: List interviewer personas
      description: |
        A persona is an interview style - pacing, follow-up pressure, silence
        - never a judgement about the candidate. The same rubric and evidence
        standard apply whichever is chosen.
      responses:
        "200":
          description: The personas.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews/practice-consent:
    get:
      tags: [interview]
      operationId: getPracticeConsent
      summary: The current practice recording consent text, versioned
      description: |
        What the wizard shows beside the recording choice. The version is
        what creation must echo back: a session stores the version it
        presented, so "what did this person agree to" resolves to exact
        words forever. A stale version at creation is refused, and the
        wizard refetches.
      responses:
        "200":
          description: The current consent document.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeConsent"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews:
    post:
      tags: [interview]
      operationId: createInterview
      summary: Create a practice interview from a catalogue selection
      description: |
        The selection is validated against the catalogue server-side, field by
        field - the wizard's filtering is a courtesy, never the rule. Only
        practice can be created here: a screening interview is a recruiter's
        act through campaign endpoints, and the mode enum refuses anything
        else at the contract. Creation starts composition; the session answers
        with its state, which the prepare screen polls to ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewRequest"
      responses:
        "201":
          description: The created session, composing.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews/{sessionId}:
    get:
      tags: [interview]
      operationId: getInterview
      summary: One practice session, as its owner sees it
      description: |
        The prepare screen's read: state, configuration and the recording
        choice. Owner-scoped by the session - the path names a session, but
        only its owner's token resolves it, and somebody else's session is
        indistinguishable from none.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/members:
    get:
      tags: [tenant]
      operationId: listMembers
      summary: Everyone in the active workspace
      description: |
        Invited members are visible before they accept; revoked members keep
        their row because the decisions they recorded stay attributed to
        them. Needs tenant.member_read under an active tenant.
      responses:
        "200":
          description: The members.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant]
      operationId: inviteMember
      summary: Invite an existing account to the workspace
      description: |
        The address must already have an account; the invitation is accepted
        by selecting the workspace. Needs tenant.member_manage, which
        requires recent authentication. The owner role cannot be assigned
        here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: The invited membership.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MemberConflict" }

  /tenant/members/{membershipId}:
    patch:
      tags: [tenant]
      operationId: changeMemberRole
      summary: Move a member to another role
      description: |
        Version-guarded against concurrent administrators, audited with the
        previous role, and never touching an owner: the anchor role is not
        this surface's to assign or remove.
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleRequest"
      responses:
        "200":
          description: The membership after the change.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemberConflict" }
    delete:
      tags: [tenant]
      operationId: revokeMember
      summary: Revoke a member's access
      description: |
        Effective on their next request - nothing caches what a membership
        grants. The row survives with its history; removing the record
        entirely is a data-deletion request.
      parameters:
        - $ref: "#/components/parameters/MembershipId"
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: The membership is revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemberConflict" }

  /tenant/usage:
    get:
      tags: [tenant]
      operationId: getTenantUsage
      summary: What the workspace has used, in the invoice's own terms
      description: |
        Counts from the append-only ledger: started sessions, credits (early
        abandons and platform interruptions, per ADR-0014), and the billable
        difference. Needs tenant.billing_read.
      responses:
        "200":
          description: The usage counts.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/quota:
    get:
      tags: [tenant]
      operationId: getTenantQuota
      summary: The limit, what remains, and where the warning stands
      description: |
        Approaching and reaching the limit both warn here before anything is
        blocked; at the limit only new starts are refused, and an interview
        already running is never touched. Needs tenant.billing_read.
      responses:
        "200":
          description: The quota position.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /interviews/{sessionId}/start:
    post:
      tags: [interview]
      operationId: startInterview
      summary: Start a ready session and receive the room grant
      description: |
        Quota is reserved before anything spends (screening only; practice
        has no tenant quota), the session moves to connecting, and the
        response carries a short-lived room grant scoped to exactly this
        session and this identity. Each refusal is its own code: an expired
        session, one already started, one not yet ready, and a workspace at
        its limit are different situations with different next actions.
        Somebody else's session is not found, because existence is not
        answered across owners.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session, connecting, with its join grant.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedInterview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Refused with a distinct code: SESSION_EXPIRED,
            SESSION_ALREADY_STARTED, SESSION_NOT_READY or QUOTA_EXHAUSTED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/events:
    post:
      tags: [interview]
      operationId: ingestControlEvents
      summary: Send a batch of control events for the current epoch
      description: |
        Ordered by sequence within the epoch, deduplicated by event id, and
        answered with the accepted contiguous cursor plus the exact gaps
        still owed. A batch from a superseded epoch is refused whole with
        EPOCH_STALE: a stale tab must not write history into a session that
        has moved on. Ephemeral types (partial captions, input levels) are
        acknowledged and never stored.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlEventBatch"
      responses:
        "200":
          description: The acknowledgment.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAcknowledgment"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EPOCH_STALE or NO_ATTEMPT, whole-batch refusals.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [interview]
      operationId: replayControlEvents
      summary: Replay the durable timeline after a cursor
      description: |
        Everything after (after_epoch, after_sequence), in the one
        authoritative order. Replaying twice from the same cursor answers
        identically; a reconnecting client rebuilds itself on that property.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: after_epoch
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: after_sequence
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: The events after the cursor.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlEventList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interviews/{sessionId}/transcript:
    get:
      tags: [interview]
      operationId: getTranscript
      summary: The assembled transcript, provenance included
      description: |
        Every version stands: a correction supersedes a segment's effective
        text while the original stays underneath with its own sequence and
        timing, linked both ways. Word-level timing rides each final segment
        on the room's single clock, and confidence is per segment. Dangling
        corrections are listed, not hidden.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The transcript.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interviews/{sessionId}/results:
    get:
      tags: [interview]
      operationId: getResults
      summary: The evaluation result, sufficiency and coverage included
      description: |
        One immutable result per session, judged by the rubric the session
        PINNED at composition, whose reference, version and digest are
        echoed here. Insufficient evidence is its own outcome: an
        unassessed competency carries a reason - NOT_DISCUSSED when the
        conversation never reached it, INSUFFICIENT_EVIDENCE when it did
        but too thinly - and never a band. There is no overall score:
        nothing here averages unassessed as zero.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The stored result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResultView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: RESULT_NOT_READY while evaluation has not landed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/review:
    get:
      tags: [interview]
      operationId: getReview
      summary: The coaching review, derived and fact-preserving
      description: |
        Per-answer strengths, gaps and a suggested rewrite assembled only
        from the candidate's own sentences plus bracketed questions where
        information is missing - a rewrite never adds a fact. Coaching is
        derived from the stored evidence, so a coaching failure leaves the
        evaluation untouched: coaching_available says so honestly and the
        results endpoint keeps answering.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The review, or the honest absence of one.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: RESULT_NOT_READY while evaluation has not landed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/complete:
    post:
      tags: [interview]
      operationId: completeInterview
      summary: Seal the transcript and hand the session to evaluation
      description: |
        Idempotent to the receipt: completing twice with the same final
        cursor answers the same seal and causes no second evaluation, while
        a different cursor is SEAL_CONFLICT. Gaps under the final cursor
        are recorded, never silently closed, and missing optional media
        continues to evaluation with an explicit warning attached.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInterviewRequest"
      responses:
        "200":
          description: The receipt, identical however many times it is asked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionReceipt"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: SESSION_NOT_RUNNING, SEAL_CONFLICT or EPOCH_STALE.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/sessions:
    get:
      tags: [interview]
      operationId: listMySessions
      summary: Every session the caller owns, every lifecycle state included
      description: |
        The whole history, newest first: a failed, expired or cancelled
        session is history too, never a hidden row. Practice only today;
        screening participation surfaces arrive with their epic.
      responses:
        "200":
          description: The sessions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me:
    get:
      tags: [authentication]
      operationId: getCurrentUser
      summary: Describe the authenticated user and their active tenant
      description: |
        Returns the user, whether their address is verified, their tenant
        memberships and which tenant is currently active.

        Memberships are listed because a user may belong to several tenants and
        the interface lets them switch. Listing a membership is not a statement
        about what it permits: that is decided per request by the capability
        layer, and the interface never treats this list as authorization.
      responses:
        "200":
          description: The current user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/memberships:
    get:
      tags: [authentication]
      operationId: listMemberships
      summary: List the workspaces this person belongs to
      description: |
        The one question that cannot be scoped by tenant, because it is asked
        before a tenant has been chosen. Answered by row-level security keyed on
        the acting user rather than by a filter in the query, so forgetting the
        filter is a missing result rather than another person's memberships.

        Listing a membership is not a statement about what it permits. That is
        decided per request by the capability layer.
      responses:
        "200":
          description: The workspaces this person belongs to, which may be none.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/active-tenant:
    put:
      tags: [authentication]
      operationId: setActiveTenant
      summary: Choose which workspace this session acts under
      description: |
        Every request operates under exactly one explicit active tenant, and it
        is never inferred from a resource identifier. This is where it is
        chosen, and the only place membership is checked: the selection is
        stored on the session, so later requests read it from a row the client
        cannot reach rather than from something the client sent.

        A null tenant clears the selection, which is how somebody leaves a
        workspace without signing out.

        Both the selection and its refusal are audited. The refusal is the one
        worth keeping: repeated attempts on workspaces somebody does not belong
        to is the shape of an account probing for access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTenantSelection"
      responses:
        "200":
          description: The session now acts under that workspace.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            No active membership of that workspace. Deliberately not 404: the
            workspace may well exist, and saying otherwise to somebody who
            cannot use it would be a way to test which identifiers are real.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: prepeet_session
      description: |
        An opaque session token, stored hashed server side so a database read
        yields nothing presentable. Opaque rather than a JWT because membership
        revocation must take effect within seconds. See ADR-0003.

  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FactId:
      name: factId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Scoped to tenant, endpoint and key together. A replay carrying the same
        body returns the stored response; a replay carrying a different body is
        409, because two different requests under one key is a client bug that
        silently succeeding would hide.
      schema:
        type: string
        format: uuid

  headers:
    CacheControl:
      description: |
        What an intermediary may do with this response, per the caching
        conventions in ADR-0004.

        Declared on every response rather than left to the server, because a
        cacheability that exists only in a handler is a property nobody can
        review and no client can rely on. What the server actually sends is
        asserted against this document, so the two cannot drift.
      required: true
      schema:
        type: string

  responses:
    Forbidden:
      description: The session holds no capability covering this.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MemberConflict:
      description: The membership is not in a state this operation applies to, or changed since it was read.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: |
        Nothing at this identifier in this scope - which deliberately covers
        both absence and somebody else's resource, so an identifier cannot be
        used to test what exists.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationFailed:
      description: The request was malformed or failed validation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session was presented.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: The idempotency key was reused with a different request body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ResendCoolingDown:
      description: |
        A recent email for this flow is on its way. The refusal carries the
        cooldown twice, in Retry-After and in the body, so the interface shows
        a countdown rather than a bare error.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          description: Seconds until the next email may be requested.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TokenRefused:
      description: |
        The token was not consumed, and the code says exactly why: invalid,
        expired, already used, superseded by a newer email, incorrect, or
        exhausted by wrong guesses. The prototype gives each its own screen,
        which only works if the response distinguishes them.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DocumentStateConflict:
      description: |
        The document is not in a state this operation applies to: completing
        an aborted upload, deleting twice. The current state is in the list
        response; nothing was changed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable and never reused for a different meaning. Generated into both
        clients as an enum, so a client can handle codes exhaustively and a new
        one is a compile-time prompt rather than a runtime surprise.

        Messages are for humans and may be reworded at any time. Only the code
        is machine logic.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - CREDENTIALS_INVALID
        - SESSION_EXPIRED
        - REFRESH_TOKEN_REUSED
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_USED
        - TOKEN_SUPERSEDED
        - CODE_INCORRECT
        - CODE_ATTEMPTS_EXHAUSTED
        - RESEND_COOLING_DOWN
        - INTERNAL

    FieldError:
      type: object
      description: One field-level validation failure.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON pointer to the offending field.
          examples: ["/email"]
        code:
          type: string
          examples: ["REQUIRED"]
        message:
          type: string

    Error:
      type: object
      description: The single error envelope every failure in this API uses.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, field_errors, request_id]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human readable, never machine logic.
            retryable:
              type: boolean
              description: Whether retrying the same request could plausibly succeed.
            field_errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
            request_id:
              type: string
              description: |
                Correlation identifier, also returned in X-Request-ID. It is
                what makes a user's support report resolvable to one trace.
              examples: ["req_01a0301daa1070009"]

    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]

    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The dependency's name. The reason it failed is never included.
        status:
          type: string
          enum: [ready, unready]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    TokenEmailKind:
      type: string
      description: Which of the four token flows an email is requested for.
      enum: [verify_email, password_reset, magic_link, otp]

    TokenEmailRequest:
      type: object
      description: Asks for one token email.
      required: [kind, email]
      properties:
        kind:
          $ref: "#/components/schemas/TokenEmailKind"
        email:
          type: string
          format: email
          maxLength: 254

    TokenEmailAccepted:
      type: object
      description: The identical answer for a known and an unknown address.
      required: [status]
      properties:
        status:
          type: string
          enum: [email_sent]
          description: Sent if the address holds an account; the response does not say.

    TokenConfirmRequest:
      type: object
      description: Presents one single-use token.
      required: [token]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 128
          description: The token from the email link, exactly as received.

    PasswordResetRequest:
      type: object
      description: Presents a recovery token and the replacement password.
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 512
          description: The new password. The same rules as registration.

    OTPConsumeRequest:
      type: object
      description: Presents an emailed one-time code for the address it went to.
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    Document:
      type: object
      description: One version of one document. Rows outlive their objects.
      required: [id, kind, version, media_type, size_bytes, state, extraction_state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [cv] }
        version: { type: integer, minimum: 1 }
        media_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [uploading, stored, failed, deleted]
          description: Failed and partial uploads keep their own states, recoverably.
        extraction_state:
          type: string
          enum: [none, pending, extracted, unsupported, failed]
          description: |
            Where extraction stands for this version. Informational always:
            unsupported and failed leave the profile fully usable, manually.
        sha256:
          type: string
          description: The content digest, present once stored. What extraction pins.
        created_at: { type: string, format: date-time }
        stored_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }

    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }

    TenantUsage:
      type: object
      required: [started, credited, billable]
      properties:
        started: { type: integer }
        credited:
          type: integer
          description: Early abandons and platform interruptions, per ADR-0014.
        billable:
          type: integer
          description: Started minus credited; the number the unit prices.

    TenantQuota:
      type: object
      required: [billable, warn_threshold, warning]
      properties:
        billable: { type: integer }
        session_limit:
          type: integer
          description: Absent when no limit is configured.
        remaining:
          type: integer
          description: Absent when no limit is configured. Never negative.
        warn_threshold: { type: number }
        warning:
          type: string
          enum: [none, approaching, reached]

    Member:
      type: object
      required: [membership_id, user_id, email, role, status, version, created_at]
      properties:
        membership_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string }
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum: [invited, active, revoked]
        version: { type: integer }
        created_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    TenantRole:
      type: string
      description: |
        The tenant role vocabulary from the capability contract. owner is
        readable but never assignable through this API.
      enum: [owner, admin, recruiter, hiring_manager, viewer]

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, recruiter, hiring_manager, viewer]

    ChangeMemberRoleRequest:
      type: object
      required: [role, expected_version]
      properties:
        role:
          type: string
          enum: [admin, recruiter, hiring_manager, viewer]
        expected_version: { type: integer }

    CompleteInterviewRequest:
      type: object
      required: [connection_epoch, final_sequence]
      properties:
        connection_epoch: { type: integer }
        final_sequence:
          type: integer
          description: The last conversational sequence the client sent.

    CompletionReceipt:
      type: object
      required:
        [session_id, state, sealed_epoch, sealed_sequence, gaps,
         transcript_digest, media_status, warnings, sealed_at]
      properties:
        session_id: { type: string, format: uuid }
        state: { type: string }
        sealed_epoch: { type: integer }
        sealed_sequence: { type: integer }
        gaps:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer }
              to: { type: integer }
        transcript_digest: { type: string }
        bundle_digest: { type: string }
        media_status:
          type: string
          enum: [none_by_choice, missing, finalized]
        warnings:
          type: array
          items: { type: string }
        sealed_at: { type: string, format: date-time }

    EvaluationResultView:
      type: object
      required: [session_id, rubric, aggregation_version, extraction_version,
                 model_version, policy_version, competencies, evidence,
                 coverage, contradictions, framing, covered_competencies,
                 total_competencies, result_digest, warnings, created_at]
      properties:
        session_id: { type: string, format: uuid }
        rubric:
          type: object
          required: [reference, version, digest]
          description: The pin the session composed with, not the published head.
          properties:
            reference: { type: string }
            version: { type: string }
            digest: { type: string }
        aggregation_version: { type: string }
        extraction_version: { type: string }
        model_version:
          type: string
          description: The literal none until a model stands behind this contract.
        policy_version: { type: string }
        competencies:
          type: array
          items: { $ref: "#/components/schemas/CompetencyResultView" }
        coverage:
          type: object
          required: [reached, not_reached]
          description: What the conversation reached and what it did not, by name.
          properties:
            reached:
              type: array
              items: { type: string }
            not_reached:
              type: array
              items: { type: string }
        evidence:
          type: array
          description: |
            The stored evidence spans behind the competency results, so
            every score expands to the exact sentences that produced it.
            Joined by the evidence_ids on each competency result.
          items: { $ref: "#/components/schemas/EvidenceSpanView" }
        contradictions:
          type: array
          description: |
            Pairs of statements that appear to conflict, both sides quoted
            with timestamps. Clarification prompts, never judgments: no
            honesty, integrity or credibility inference exists anywhere in
            this pipeline.
          items: { $ref: "#/components/schemas/ContradictionView" }
        framing:
          type: object
          required: [unverified, contradictions, confidence]
          description: |
            Server-supplied copy every surface must show beside these
            concepts. Unverified does not mean untrue; a contradiction is
            something to ask about; confidence is evidence sufficiency,
            never a probability of job success.
          properties:
            unverified: { type: string }
            contradictions: { type: string }
            confidence: { type: string }
        covered_competencies: { type: integer }
        total_competencies: { type: integer }
        result_digest: { type: string }
        warnings:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ReviewView:
      type: object
      required: [session_id, coaching_version, coaching_available, answers]
      properties:
        session_id: { type: string, format: uuid }
        coaching_version: { type: string }
        coaching_available:
          type: boolean
          description: |
            False when coaching could not be derived or failed its
            fact-preservation gate. The evaluation is intact either way.
        note:
          type: string
          description: Why coaching is unavailable, when it is.
        answers:
          type: array
          items: { $ref: "#/components/schemas/AnswerCoachingView" }

    AnswerCoachingView:
      type: object
      required: [sequence, strengths, gaps, rewrite]
      properties:
        sequence: { type: integer }
        strengths:
          type: array
          items: { $ref: "#/components/schemas/CoachingPointView" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/CoachingPointView" }
        rewrite:
          type: array
          description: Empty when nothing useful would change.
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                type: string
                enum: [quote, placeholder]
              text: { type: string }

    CoachingPointView:
      type: object
      required: [statement, quote]
      properties:
        statement: { type: string }
        quote:
          type: string
          description: The exact words the statement is about.

    EvidenceSpanView:
      type: object
      required: [id, competency_id, kind, quote, segment_sequence,
                 start_ms, end_ms]
      properties:
        id: { type: string }
        competency_id: { type: string }
        kind:
          type: string
          enum: [supporting, contradictory, claim_unverified, gap]
        quote: { type: string }
        segment_sequence: { type: integer }
        start_ms: { type: integer }
        end_ms: { type: integer }

    ContradictionView:
      type: object
      required: [topic, side_a, side_b]
      properties:
        topic:
          type: array
          items: { type: string }
          description: The shared subject tokens that made the pair.
        side_a: { $ref: "#/components/schemas/ContradictionSideView" }
        side_b: { $ref: "#/components/schemas/ContradictionSideView" }

    ContradictionSideView:
      type: object
      required: [segment_sequence, quote, start_ms, end_ms]
      properties:
        segment_sequence: { type: integer }
        quote: { type: string }
        start_ms: { type: integer }
        end_ms: { type: integer }

    CompetencyResultView:
      type: object
      required: [competency_id, status, confidence, evidence_count,
                 supporting, contradictory, unverified, gaps, evidence_ids,
                 reason_codes]
      properties:
        competency_id: { type: string }
        status:
          type: string
          enum: [assessed, unassessed]
          description: Unassessed is its own outcome, never a low band.
        confidence:
          type: string
          enum: [high, medium, low, not_assessable]
          description: |
            Evidence sufficiency by the pinned rubric's own rules
            (ADR-0015). Not a probability, not comparable across roles or
            rubric versions, never a ranking.
        evidence_ids:
          type: array
          items: { type: string }
          description: The stored evidence spans this result aggregated.
        band:
          type: string
          description: Present only when status is assessed.
        evidence_count: { type: integer }
        supporting: { type: integer }
        contradictory: { type: integer }
        unverified: { type: integer }
        gaps: { type: integer }
        reason_codes:
          type: array
          items: { type: string }

    TranscriptView:
      type: object
      required: [segments, orphan_corrections]
      properties:
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        orphan_corrections:
          type: array
          items: { type: integer }
          description: Corrections whose target has not arrived; a resend is owed.

    TranscriptSegment:
      type: object
      required: [epoch, sequence, type, speaker, text, start_ms, end_ms, confidence, superseded]
      properties:
        epoch: { type: integer }
        sequence: { type: integer }
        type:
          type: string
          enum: [transcript.segment.final, transcript.segment.corrected]
        speaker:
          type: string
          enum: [candidate, interviewer]
        text: { type: string }
        start_ms: { type: integer }
        end_ms: { type: integer }
        confidence: { type: number }
        words:
          type: array
          items:
            type: object
            required: [w, start_ms, end_ms, confidence]
            properties:
              w: { type: string }
              start_ms: { type: integer }
              end_ms: { type: integer }
              confidence: { type: number }
        superseded:
          type: boolean
          description: True when a correction replaced this text. The row stands.
        corrected_by_sequence: { type: integer }
        supersedes: { type: integer }

    ControlEvent:
      type: object
      required: [event_id, sequence, type, occurred_at]
      properties:
        event_id: { type: string, format: uuid }
        sequence:
          type: integer
          description: Orders within the epoch. Zero for ephemeral types.
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }

    ControlEventBatch:
      type: object
      required: [connection_epoch, events]
      properties:
        connection_epoch: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/ControlEvent" }

    ControlAcknowledgment:
      type: object
      required: [connection_epoch, accepted_sequence, missing, outcomes]
      properties:
        connection_epoch: { type: integer }
        accepted_sequence:
          type: integer
          description: Highest contiguous sequence durably held.
        missing:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer }
              to: { type: integer }
        outcomes:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id: { type: string, format: uuid }
              status:
                type: string
                enum: [accepted, duplicate, refused]
              reason: { type: string }

    ControlEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
            required: [event_id, connection_epoch, sequence, type, payload, occurred_at]
            properties:
              event_id: { type: string, format: uuid }
              connection_epoch: { type: integer }
              sequence: { type: integer }
              type: { type: string }
              payload:
                type: object
                additionalProperties: true
              occurred_at: { type: string, format: date-time }

    StartedInterview:
      type: object
      required: [session, realtime, timing]
      properties:
        session:
          $ref: "#/components/schemas/InterviewSession"
        realtime:
          $ref: "#/components/schemas/RoomGrant"
        timing:
          $ref: "#/components/schemas/TimingPolicyView"

    TimingPolicyView:
      type: object
      description: |
        The timing rules stamped on this session at start, versioned in
        the database and served here so no grace window or ceiling is
        ever a constant compiled into a client. Reconnecting does not
        consume interview time.
      required: [policy_version, reconnect_grace_seconds, max_overrun_seconds]
      properties:
        policy_version: { type: integer }
        reconnect_grace_seconds: { type: integer }
        max_overrun_seconds: { type: integer }

    RoomGrant:
      type: object
      description: |
        Short-lived, scoped to one room and one identity, never reusable
        across attempts: reconnection mints a fresh grant. The browser
        presents it to the SFU and holds no durable media credential.
      required: [url, room, token, expires_at]
      properties:
        url: { type: string }
        room: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }

    CreateInterviewRequest:
      type: object
      required: [mode, discipline, role, shape, minutes, persona, recording]
      properties:
        mode:
          type: string
          enum: [practice]
          description: |
            Only practice. A screening interview is created by a recruiter
            through campaign endpoints; this enum is the refusal.
        discipline: { type: string }
        role: { type: string }
        shape: { type: string }
        minutes: { type: integer }
        persona: { type: string }
        recording:
          $ref: "#/components/schemas/RecordingConsent"

    RecordingConsent:
      type: object
      description: |
        What the session keeps, and which consent text the choice was made
        against. The version must be the currently published one; a stale
        version is refused so nobody consents to words they were not shown.
      required: [preference, consent_version]
      properties:
        preference:
          type: string
          enum: [audio_and_transcript, transcript_only]
        consent_version: { type: string }

    PracticeConsent:
      type: object
      required: [version, title, statements, choices]
      properties:
        version: { type: string }
        title: { type: string }
        statements:
          type: array
          items: { type: string }
        choices:
          type: object
          required: [audio_and_transcript, transcript_only]
          properties:
            audio_and_transcript:
              $ref: "#/components/schemas/ConsentChoice"
            transcript_only:
              $ref: "#/components/schemas/ConsentChoice"

    ConsentChoice:
      type: object
      required: [label, explanation]
      properties:
        label: { type: string }
        explanation: { type: string }
        forfeits:
          type: array
          items: { type: string }
          description: What choosing this visibly costs. Named, never implied.

    InterviewSession:
      type: object
      required: [id, mode, state, config, recording_preference, consent_version, created_at]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [practice, screening] }
        state:
          type: string
          description: The lifecycle state, from session-lifecycle.md.
        config:
          $ref: "#/components/schemas/InterviewConfig"
        recording_preference:
          type: string
          enum: [audio_and_transcript, transcript_only]
        consent_version:
          type: string
          description: The consent text version the preference was chosen against.
        failure_code:
          type: string
          description: The stable refusal code, present in a *_failed state.
        cursor:
          type: object
          description: |
            Where the durable timeline stands: the current connection epoch
            and the highest contiguous accepted sequence. What completion
            seals at.
          required: [connection_epoch, accepted_sequence]
          properties:
            connection_epoch: { type: integer }
            accepted_sequence: { type: integer }
        seal:
          type: object
          description: |
            The completion receipt, durable: present once the session has
            sealed, identical however often it is read.
          required: [sealed_at, media_status, warnings]
          properties:
            sealed_at: { type: string, format: date-time }
            media_status:
              type: string
              enum: [finalized, missing, none_by_choice]
            warnings:
              type: array
              items: { type: string }
        created_at: { type: string, format: date-time }

    InterviewConfig:
      type: object
      required: [discipline, role, shape, minutes, persona]
      properties:
        discipline: { type: string }
        role: { type: string }
        shape: { type: string }
        minutes: { type: integer }
        persona: { type: string }

    Discipline:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DisciplineList:
      type: object
      required: [disciplines]
      properties:
        disciplines:
          type: array
          items: { $ref: "#/components/schemas/Discipline" }

    CatalogRole:
      type: object
      required: [id, discipline, title, organisation, competencies, shapes]
      properties:
        id: { type: string }
        discipline: { type: string }
        title: { type: string }
        organisation: { type: string }
        competencies:
          type: array
          items: { type: string }
        shapes:
          type: array
          items: { type: string }
          description: The interview shapes this role offers; the combination rule.

    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/CatalogRole" }

    InterviewShape:
      type: object
      required: [id, name, description, minutes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        minutes:
          type: array
          items: { type: integer }
          description: The lengths this shape can honestly run at.

    ShapeList:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          items: { $ref: "#/components/schemas/InterviewShape" }

    Persona:
      type: object
      required: [id, name, style, voice, description, best_for, shapes]
      properties:
        id: { type: string }
        name: { type: string }
        style: { type: string }
        voice: { type: string }
        description: { type: string }
        best_for: { type: string }
        shapes:
          type: array
          items: { type: string }
          description: The shapes this persona runs. Empty means unrestricted.

    PersonaList:
      type: object
      required: [personas]
      properties:
        personas:
          type: array
          items: { $ref: "#/components/schemas/Persona" }

    Fact:
      type: object
      description: |
        One thing extraction read, with its provenance. The value is what the
        extractor produced and is never rewritten; corrected_value is the
        candidate's version, present exactly while status is corrected.
      required:
        [id, document_id, kind, value, span_start, span_end, confidence,
         extractor_version, status, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [role, skill, date_range, achievement, unparsed]
        value:
          type: object
          additionalProperties: true
          description: The extracted value, shaped per kind.
        corrected_value:
          type: object
          additionalProperties: true
          description: The candidate's version, only while corrected.
        span_start:
          type: integer
          minimum: 0
          description: Half-open source range, in characters of the extracted text.
        span_end: { type: integer, minimum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        extractor_version: { type: string }
        status:
          type: string
          enum: [proposed, confirmed, corrected, rejected]
        created_at: { type: string, format: date-time }
        reviewed_at:
          type: string
          format: date-time
          description: When the candidate last acted. Absent while proposed.

    FactList:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items: { $ref: "#/components/schemas/Fact" }

    ReviewFactRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, corrected, rejected]
          description: proposed is the pipeline's word, not a move.
        corrected_value:
          type: object
          additionalProperties: true
          description: Required when status is corrected, refused otherwise.

    StartUploadRequest:
      type: object
      required: [media_type, size_bytes, part_count]
      properties:
        media_type:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
        part_count: { type: integer, minimum: 1, maximum: 4 }

    StartedUpload:
      type: object
      description: What the browser needs to carry the bytes itself.
      required: [document, upload_id, part_urls, expires_at]
      properties:
        document: { $ref: "#/components/schemas/Document" }
        upload_id: { type: string }
        part_urls:
          type: array
          items: { type: string }
          description: Presigned PUT URLs, one per part, in part order.
        expires_at:
          type: string
          format: date-time
          description: When the URLs stop working, shown rather than discovered.

    CompleteUploadRequest:
      type: object
      required: [upload_id, sha256, size_bytes, parts]
      properties:
        upload_id: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        parts:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [number, etag]
            properties:
              number: { type: integer, minimum: 1 }
              etag: { type: string }

    CandidateProfile:
      type: object
      description: |
        The candidate's own profile. Every field is optional, and absent
        arrays serialise as empty: a partial profile is a profile.
      required:
        [disciplines, target_roles, extended_time, captions, reduced_motion,
         notify_product_updates, notify_practice_reminders]
      properties:
        disciplines:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
          description: What they practise for, in their own words until the catalogue exists.
        target_roles:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        seniority:
          type: string
          maxLength: 80
        career_context:
          type: string
          maxLength: 4000
          description: Their own account of where they are and where they are going.
        default_duration_minutes:
          type: integer
          minimum: 10
          maximum: 90
          description: Applied when creating a practice session; overridable there.
        default_style:
          type: string
          maxLength: 80
        default_pressure:
          type: string
          enum: [low, standard, high]
        extended_time:
          type: boolean
          description: Accessibility preference the prepare and live screens honour by default.
        captions:
          type: boolean
        reduced_motion:
          type: boolean
        accessibility_notes:
          type: string
          maxLength: 2000
        notify_product_updates:
          type: boolean
        notify_practice_reminders:
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, account_type]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Hashed with argon2id and never logged. The maximum is not a strength
            policy: argon2 hashes whatever it is given, so an unbounded input is
            a denial of service.
        account_type:
          type: string
          enum: [candidate, organisation]
          description: |
            A candidate registers for themselves. An organisation registration
            additionally creates a tenant and an owning membership.
        organisation_name:
          type: string
          maxLength: 200
          description: Required when account_type is organisation.

    RegistrationAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [verification_sent]
          description: |
            Returned whether or not the address was already registered. The
            response is deliberately uninformative about which.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    Session:
      type: object
      description: |
        Describes the session that was established. The tokens themselves are
        in HTTP-only cookies and never appear in a response body, so no script
        in the page can read them.
      required: [user_id, expires_at, authenticated_at]
      properties:
        user_id:
          type: string
          format: uuid
        active_tenant_id:
          type: [string, "null"]
          format: uuid
          description: |
            Null for a candidate who belongs to no tenant. Every request
            operates under exactly one explicit active tenant, and it is never
            inferred from a resource identifier.
        expires_at:
          type: string
          format: date-time
        authenticated_at:
          type: string
          format: date-time
          description: |
            When the user last proved who they are, which is not when the
            session was issued. Destructive and evaluation-changing capabilities
            require this to be recent.

    MembershipList:
      type: object
      additionalProperties: false
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    ActiveTenantSelection:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: |
            The workspace to act under, or null to act under none.

    Membership:
      type: object
      required: [tenant_id, tenant_name, status]
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        status:
          type: string
          enum: [invited, active, revoked]

    CurrentUser:
      type: object
      required: [user_id, email_verified, memberships, capabilities]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        active_tenant_id:
          type: [string, "null"]
          format: uuid
        memberships:
          type: array
          description: |
            A user may belong to several tenants. The interface lets them switch,
            and the server decides what each membership permits.
          items:
            $ref: "#/components/schemas/Membership"
        capabilities:
          type: array
          description: |
            What this session may do under its active tenant. The set changes
            when the active tenant changes, and is empty for somebody who has
            not chosen one and belongs to no workspace.

            Present so an interface can avoid offering a control that will
            refuse the person using it. Rendering is never what stops access:
            every request is authorised on the server against the same
            capabilities, and one for something not held is denied whether or
            not anything was drawn.

            Names come from the capability catalogue in
            packages/contracts/authz/capabilities.yaml, which generates both
            the server's constants and the browser's.
          items:
            type: string
            description: A capability name, such as campaign.read.

security:
  - sessionCookie: []
