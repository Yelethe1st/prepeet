# The public API contract.
#
# This document is the source. The Go server interface and the TypeScript client
# are generated from it, and a handler that does not satisfy the generated
# interface does not compile. See ADR-0004.
#
# Written first rather than derived from code because much of what is here is a
# compliance obligation rather than an implementation detail: 404 where
# existence is sensitive, error codes that never change meaning, and idempotency
# that cannot bill an interview twice. Those need to be readable by legal and
# security in one artifact before a screening pilot.
#
# Every operation carries `x-prepeet-capability`, naming the authority a caller
# needs. The value is an entry in packages/contracts/authz/capabilities.yaml, or
# one of three reserved words for the operations no catalogue entry describes:
#
#   public         no credential at all - the probes, and the operations a
#                  person uses before they have a session
#   authenticated  a valid session and nothing further, because the answer is
#                  the same for everyone who holds one
#   service        the deployment's own service token, never a person's
#                  session (ADR-0019)
#
# It is here rather than in the handlers because "which authority reaches a
# candidate's practice history" is a question legal and security have to answer
# from one artifact, and a Go string literal per operation is not that artifact.
# The declaration is enforced three ways: Spectral requires it, a test refuses a
# value the capability catalogue does not define, and the server takes the
# capability it enforces from this document rather than from a literal of its
# own.
openapi: 3.1.0

info:
  title: Prepeet API
  version: "1.0.0"
  description: |
    The browser talks to this API and to nothing else. It never reaches
    PostgreSQL, Temporal, object storage or the intelligence service directly,
    which is what keeps authorization decidable in one place.

    Every request operates under exactly one explicit active tenant. Tenant is
    never inferred from a resource identifier.
  contact:
    name: Prepeet engineering

servers:
  - url: /api/v1
    description: Version in the path. A new version is a project rather than a release.

tags:
  - name: health
    description: Deployment probes. Unauthenticated.
  - name: authentication
    description: Registration, login, logout and session refresh.
  - name: candidate
    description: The candidate's own data. Owner-scoped; no tenant authority reaches it.
  - name: catalog
    description: The interview catalogue - disciplines, roles, shapes and personas - served from the artifact registry, never hardcoded.
  - name: interview
    description: Interview sessions - creation from a validated catalogue selection; the lifecycle endpoints arrive with the session tickets.
  - name: tenant
    description: Workspace administration - members and roles. Every operation is decided by the capability catalogue, tenant-scoped, and audited.
  - name: recruiting
    description: Campaigns and who works on them. Listing is tenant-wide by design, per the capability catalogue - a recruiter may see which campaigns exist before being assigned to one - while everything about a particular campaign is scoped to the recruiters on it, enforced by the database join rather than by a handler remembering.
  - name: progression
    description: A candidate's own competency history over time - readiness against a pinned role standard, and how current the evidence behind each reading is. Owner-scoped, like the practice data it is derived from.
  - name: internal
    description: The platform's own automation speaking to itself - the voice agent writing the transcript it is the source of. A deployment service token, never a person's session (ADR-0019).

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      x-prepeet-capability: public
      summary: Report whether the process is running
      description: |
        Deliberately ignores dependencies. If a failing database made this fail,
        the orchestrator would restart healthy processes during an outage and
        turn a degradation into an outage.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      x-prepeet-capability: public
      summary: Report whether this process can serve traffic
      description: |
        503 tells a load balancer to route elsewhere without restarting
        anything. The response never carries a dependency's error detail, which
        routinely contains a host, a port and sometimes a credential.
      security: []
      responses:
        "200":
          description: Every dependency answered.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency did not answer.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /auth/register:
    post:
      tags: [authentication]
      operationId: register
      x-prepeet-capability: public
      summary: Register a candidate or an organisation
      description: |
        Answers identically whether or not the address is already registered.
        Confirming an address here would let anyone enumerate who practises for
        interviews, which is information a candidate has not agreed to share.

        Registration never signs the user in. Verification comes first, and the
        response says only that the next step has been sent.
      security: []
      parameters:

        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: |
            Accepted. Returned whether the address was new or already known, so
            the response cannot be used to test for an account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [authentication]
      operationId: login
      x-prepeet-capability: public
      summary: Exchange credentials for a session
      description: |
        A wrong password and an unregistered address produce the same response
        and take the same time, because timing leaks what a carefully worded
        body does not.

        On success the session and refresh tokens are set as HTTP-only,
        SameSite cookies rather than returned in the body, so no script in the
        page can read them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: |
            The credentials did not authenticate. Identical for an unknown
            address and a wrong password.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/providers:
    get:
      tags: [authentication]
      operationId: listOAuthProviders
      x-prepeet-capability: public
      summary: Which sign-in providers this deployment offers
      description: |
        The sign-in screen draws a button per provider returned here rather
        than hard-coding a list, so adding one is configuration and a
        deployment rather than a release. A deployment with none configured
        answers an empty list, and the screen shows email and password alone.
      security: []
      responses:
        "200":
          description: The configured providers, in a stable order.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProviders"

  /auth/oauth/{provider}/start:
    post:
      tags: [authentication]
      operationId: startOAuth
      x-prepeet-capability: public
      summary: Begin signing in with a provider
      description: |
        Mints the anti-forgery state and the PKCE verifier, stores both
        server-side, and answers where to send the browser. The verifier never
        leaves the server; only its challenge does.

        The state is single-use and expires in ten minutes. Refusals:
        OAUTH_PROVIDER_UNKNOWN.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStart"
        "404":
          description: OAUTH_PROVIDER_UNKNOWN for a provider that is not configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/{provider}/callback:
    post:
      tags: [authentication]
      operationId: completeOAuth
      x-prepeet-capability: public
      summary: Finish signing in with a provider
      description: |
        Consumes the state, exchanges the authorisation code with the provider
        presenting the PKCE verifier, and issues the same session the password
        flow issues, with the same cookies, rotation and revocation. There is
        no second way to hold a session.

        The state is consumed before the provider is called, so a replayed
        callback is refused whether or not the provider would have answered.

        Refusals: OAUTH_STATE_INVALID for a state that is absent, unknown,
        already used or minted for a different provider; OAUTH_STATE_EXPIRED
        for one that timed out; OAUTH_EMAIL_UNVERIFIED when the provider
        asserts an address it has not verified and an account already holds
        it.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: Authenticated, with the session and refresh cookies set.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSession"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: OAUTH_PROVIDER_UNKNOWN for a provider that is not configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            OAUTH_STATE_INVALID, OAUTH_STATE_EXPIRED or
            OAUTH_EMAIL_UNVERIFIED. Each names what happened and what to do.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [authentication]
      operationId: logout
      x-prepeet-capability: public
      summary: End the current session
      description: |
        Revokes the session and its refresh family, so a stolen refresh token
        cannot outlive the logout. Idempotent: logging out twice is not an error.

        The session cookie is optional rather than required, which is what the
        security block says. Send it and the session is revoked; send nothing
        and the cookies are still cleared. A request with no session is not a
        failure, so this operation has no 401 to declare: a client told its
        logout was unauthorised would reasonably conclude it was still signed
        in, which would be the opposite of what happened.
      security:
        - {}
        - sessionCookie: []
      responses:
        "204":
          description: The session is ended.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Expired session and refresh cookies.
              schema: { type: string }

  /auth/refresh:
    post:
      tags: [authentication]
      operationId: refresh
      x-prepeet-capability: public
      summary: Rotate the session using a refresh token
      description: |
        Each refresh issues a new pair and retires the old one. Presenting a
        retired token means either a stolen token or a client bug, and both are
        handled the same way: the whole session family is revoked and the event
        is audited. Being logged out is a cheap failure; an attacker keeping a
        foothold is not.
      security: []
      responses:
        "200":
          description: A new session was issued and the old one retired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Rotated session and refresh cookies.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: |
            The refresh token was missing, expired, or already used. A reused
            token also revokes the entire family.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email/request:
    post:
      tags: [authentication]
      operationId: requestTokenEmail
      x-prepeet-capability: public
      summary: Send a verification, recovery, sign-in or code email
      description: |
        One request surface for the four token flows, distinguished by kind.
        Answers 202 identically for a known and an unknown address, because
        confirming which addresses hold accounts is the enumeration every
        response in this contract refuses.

        Resending is rate limited per address with a visible cooldown: the 429
        carries Retry-After and the same value in the body, so the interface
        can show a countdown rather than a bare refusal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenEmailRequest"
      responses:
        "202":
          description: |
            Accepted. If the address holds an account, an email is on its way;
            the response does not say whether it does.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEmailAccepted"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/ResendCoolingDown" }

  /auth/email/verify:
    post:
      tags: [authentication]
      operationId: confirmEmailVerification
      x-prepeet-capability: public
      summary: Confirm an email address with a verification token
      description: |
        Consumes the single-use token from the verification email. Replaying a
        consumed token repeats nothing and earns TOKEN_USED, which the
        interface shows as "already done" rather than as a failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "204":
          description: The address is verified.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/password/reset:
    post:
      tags: [authentication]
      operationId: confirmPasswordReset
      x-prepeet-capability: public
      summary: Set a new password with a recovery token
      description: |
        Consumes the single-use token from the recovery email and replaces the
        password. Every existing session is revoked in the same transaction,
        because the reset exists precisely when the old password may be in
        somebody else's hands.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: The password is changed and every session revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/magic/consume:
    post:
      tags: [authentication]
      operationId: consumeMagicLink
      x-prepeet-capability: public
      summary: Sign in with a magic link token
      description: |
        Consumes the single-use token and issues a session in the same cookies
        login sets. Arriving here proves control of the address, so it is also
        marked verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /auth/otp/consume:
    post:
      tags: [authentication]
      operationId: consumeOTP
      x-prepeet-capability: public
      summary: Sign in with a one-time code
      description: |
        Exchanges the emailed six-digit code for a session. A wrong code and an
        unknown address answer identically, and the fifth wrong code kills the
        token: six digits survive guessing only because of the cap, and the
        person who asked for the code loses nothing but a resend.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPConsumeRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422": { $ref: "#/components/responses/TokenRefused" }

  /me/profile:
    get:
      tags: [candidate]
      operationId: getProfile
      x-prepeet-capability: candidate.profile.read_own
      summary: Read the candidate's own profile
      description: |
        The profile is the candidate's alone; the session decides whose it is
        and there is no way to name anybody else's. A candidate who never
        saved gets the empty profile rather than an error, because a partial
        profile is usable and the first visit must not look broken.
      responses:
        "200":
          description: The profile, possibly empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [candidate]
      operationId: saveProfile
      x-prepeet-capability: candidate.profile.write_own
      summary: Replace the candidate's own profile
      description: |
        Whole-record replace: the profile is one screen, the screen submits
        what it shows, and field-level merges are where two tabs quietly
        assemble a profile neither displayed. Every field is optional;
        nothing is blocked behind completeness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfile"
      responses:
        "200":
          description: The profile as stored, after normalisation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/documents:
    get:
      tags: [candidate]
      operationId: listDocuments
      x-prepeet-capability: candidate.profile.read_own
      summary: List the candidate's own documents, every version and state
      description: |
        Newest first, states included: a stuck upload is visible beside the
        version that superseded it, and a deleted version's record stands
        because a session bundle may have pinned its digest.
      responses:
        "200":
          description: The document history.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [candidate]
      operationId: startDocumentUpload
      x-prepeet-capability: candidate.profile.write_own
      summary: Start a CV upload
      description: |
        Allocates the next version and returns presigned URLs the browser
        PUTs the bytes to directly; the server never proxies the file and the
        browser never holds a durable credential. Every upload is a new
        version - replacement is version n+1 existing, never version n
        changing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartUploadRequest"
      responses:
        "201":
          description: The upload, ready for the browser to carry the bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedUpload"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/documents/{documentId}/complete:
    post:
      tags: [candidate]
      operationId: completeDocumentUpload
      x-prepeet-capability: candidate.profile.write_own
      summary: Finalise an upload
      description: |
        The stored size is verified against what actually landed; the digest
        is recorded as the identity extraction and composition will pin.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: The stored document.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}/abort:
    post:
      tags: [candidate]
      operationId: abortDocumentUpload
      x-prepeet-capability: candidate.profile.write_own
      summary: Abandon a stalled upload
      description: |
        The multipart upload is discarded and the version reads failed,
        visibly - its own recoverable state, recovered by simply uploading
        again as the next version.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: The upload is abandoned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}:
    delete:
      tags: [candidate]
      operationId: deleteDocument
      x-prepeet-capability: candidate.profile.write_own
      summary: Delete a stored document
      description: |
        The bytes are destroyed; the version's record stands with its digest,
        because a session bundle composed from it must stay answerable.
        Deletion never rewrites a session composed from an earlier version.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: The object is deleted; the record remains.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DocumentStateConflict" }

  /me/documents/{documentId}/facts:
    get:
      tags: [candidate]
      operationId: listDocumentFacts
      x-prepeet-capability: candidate.profile.read_own
      summary: List what extraction read from one document
      description: |
        Every fact carries the exact source span that produced it, its
        confidence, the extractor version and its review state. Unparsed text
        arrives as facts of kind unparsed rather than silently missing.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document's facts, in span order.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/facts/{factId}/review:
    post:
      tags: [candidate]
      operationId: reviewFact
      x-prepeet-capability: candidate.profile.write_own
      summary: Confirm, correct or reject one extracted fact
      description: |
        Correcting records the correction beside the original extraction,
        which is never rewritten; rejecting is a status, not a deletion.
        Downstream reads serve the correction and omit the rejected from the
        moment the review lands.
      parameters:
        - $ref: "#/components/parameters/FactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewFactRequest"
      responses:
        "200":
          description: The fact after the review.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fact"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/disciplines:
    get:
      tags: [catalog]
      operationId: listDisciplines
      x-prepeet-capability: authenticated
      summary: List the professions the product serves
      description: |
        The disciplines the catalogue currently offers, resolved from the
        published catalogue artifact rather than hardcoded, so adding a
        profession is a content change and never a deployment.
      responses:
        "200":
          description: The disciplines.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/roles:
    get:
      tags: [catalog]
      operationId: listRoles
      x-prepeet-capability: authenticated
      summary: List catalogued roles with their valid combinations
      description: |
        Each role names its discipline and the interview shapes it offers,
        which is the combination rule the server enforces at composition. The
        browser may filter by these; the server never trusts that it did.
      responses:
        "200":
          description: The roles.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/interview-shapes:
    get:
      tags: [catalog]
      operationId: listInterviewShapes
      x-prepeet-capability: authenticated
      summary: List interview shapes with their runnable lengths
      description: |
        Each shape with the lengths it can actually be run at, from the
        published catalogue artifact: the wizard offers exactly what the
        catalogue admits, so an unrunnable combination cannot be chosen.
      responses:
        "200":
          description: The shapes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShapeList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /catalog/personas:
    get:
      tags: [catalog]
      operationId: listPersonas
      x-prepeet-capability: authenticated
      summary: List interviewer personas
      description: |
        A persona is an interview style - pacing, follow-up pressure, silence
        - never a judgement about the candidate. The same rubric and evidence
        standard apply whichever is chosen.
      responses:
        "200":
          description: The personas.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews/practice-consent:
    get:
      tags: [interview]
      operationId: getPracticeConsent
      x-prepeet-capability: authenticated
      summary: The current practice recording consent text, versioned
      description: |
        What the wizard shows beside the recording choice. The version is
        what creation must echo back: a session stores the version it
        presented, so "what did this person agree to" resolves to exact
        words forever. A stale version at creation is refused, and the
        wizard refetches.
      responses:
        "200":
          description: The current consent document.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeConsent"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews:
    post:
      tags: [interview]
      operationId: createInterview
      x-prepeet-capability: session.create_practice
      summary: Create a practice interview from a catalogue selection
      description: |
        The selection is validated against the catalogue server-side, field by
        field - the wizard's filtering is a courtesy, never the rule. Only
        practice can be created here: a screening interview is a recruiter's
        act through campaign endpoints, and the mode enum refuses anything
        else at the contract. Creation starts composition; the session answers
        with its state, which the prepare screen polls to ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewRequest"
      responses:
        "201":
          description: The created session, composing.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /interviews/{sessionId}:
    get:
      tags: [interview]
      operationId: getInterview
      x-prepeet-capability: session.read_own_practice
      summary: One practice session, as its owner sees it
      description: |
        The prepare screen's read: state, configuration and the recording
        choice. Owner-scoped by the session - the path names a session, but
        only its owner's token resolves it, and somebody else's session is
        indistinguishable from none.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/members:
    get:
      tags: [tenant]
      operationId: listMembers
      x-prepeet-capability: tenant.member_read
      summary: Everyone in the active workspace
      description: |
        Invited members are visible before they accept; revoked members keep
        their row because the decisions they recorded stay attributed to
        them. Needs tenant.member_read under an active tenant.
      responses:
        "200":
          description: The members.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant]
      operationId: inviteMember
      x-prepeet-capability: tenant.member_manage
      summary: Invite an existing account to the workspace
      description: |
        The address must already have an account; the invitation is accepted
        by selecting the workspace. Needs tenant.member_manage, which
        requires recent authentication. The owner role cannot be assigned
        here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: The invited membership.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MemberConflict" }

  /tenant/members/{membershipId}:
    patch:
      tags: [tenant]
      operationId: changeMemberRole
      x-prepeet-capability: tenant.member_manage
      summary: Move a member to another role
      description: |
        Version-guarded against concurrent administrators, audited with the
        previous role, and never touching an owner: the anchor role is not
        this surface's to assign or remove.
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleRequest"
      responses:
        "200":
          description: The membership after the change.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemberConflict" }
    delete:
      tags: [tenant]
      operationId: revokeMember
      x-prepeet-capability: tenant.member_manage
      summary: Revoke a member's access
      description: |
        Effective on their next request - nothing caches what a membership
        grants. The row survives with its history; removing the record
        entirely is a data-deletion request.
      parameters:
        - $ref: "#/components/parameters/MembershipId"
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: The membership is revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemberConflict" }

  /campaigns:
    get:
      tags: [recruiting]
      operationId: listCampaigns
      x-prepeet-capability: campaign.read
      summary: Every campaign in the workspace
      description: |
        Tenant-wide, which is what campaign.read means: a recruiter may see
        which campaigns exist before being assigned to one. What they may not
        see without an assignment is anything inside one, which is why the
        entries here carry no pins and no determination.
      responses:
        "200":
          description: The campaigns, newest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [recruiting]
      operationId: createCampaign
      x-prepeet-capability: campaign.read
      summary: Start a draft campaign
      description: |
        A draft accepts configuration and issues nothing. The creator is put on
        the campaign in the same transaction that creates it, because a
        campaign its creator cannot open is a race nobody should be able to
        lose.

        campaign.read rather than campaign.manage, deliberately: manage is
        scoped to a campaign, and a campaign that does not exist yet has no
        scope anybody could hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role_reference, jurisdiction]
              properties:
                name: { type: string, minLength: 1 }
                role_reference: { type: string, minLength: 1 }
                jurisdiction:
                  type: string
                  description: ISO 3166-1 alpha-2, or alpha-2 with a subdivision.
      responses:
        "201":
          description: The draft.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /campaigns/{campaignId}:
    get:
      tags: [recruiting]
      operationId: getCampaign
      x-prepeet-capability: campaign.read
      summary: One campaign, for a recruiter on it
      description: |
        Scoped to the recruiters on the campaign by the database join, so a
        member who is not on it receives the same not-found a campaign that
        never existed produces. Telling those apart would let anybody
        enumerate who is hiring for what.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The campaign.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/open:
    post:
      tags: [recruiting]
      operationId: openCampaign
      x-prepeet-capability: campaign.read
      summary: Freeze the configuration and begin issuing
      description: |
        Opening is the moment every pin is checked and frozen. The chosen
        references are resolved to published artifacts and stored by digest, so
        republishing an artifact afterwards changes nothing this campaign has
        already scored. A jurisdiction with no recorded legal determination is
        refused outright, per ADR-0020, and that refusal is reported first
        because it is the one failure nobody in the product can fix.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pins]
              properties:
                pins:
                  type: array
                  description: One choice per required artifact kind, by reference.
                  items:
                    type: object
                    required: [type, reference]
                    properties:
                      type: { type: string }
                      reference: { type: string }
      responses:
        "200":
          description: The campaign, now open, with what it pinned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The campaign is not a draft, so its configuration is already frozen.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The configuration cannot open: a required artifact is missing or
            unpublished, or the jurisdiction has no recorded determination. The
            code says which, because the recruiter's next step differs.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/recruiters:
    post:
      tags: [recruiting]
      operationId: grantCampaignAccess
      x-prepeet-capability: campaign.read
      summary: Put a member on the campaign
      description: |
        Only a recruiter already on the campaign may add another, enforced by
        the same join that scopes reading it. Tenant membership is not
        authority over a campaign; being on it is.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "204":
          description: Granted. Granting twice is not an error.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/job-context:
    put:
      tags: [recruiting]
      operationId: submitJobContext
      x-prepeet-capability: campaign.read
      summary: Set the job description and extract its requirements
      description: |
        Stores the job description a screening campaign draws on and replaces its
        requirements with a fresh extraction. Each requirement carries the span
        of the source it came from, so it is reviewable in context and auditable
        later. Resubmitting replaces both the source and the requirements
        wholesale, because the old spans were measured in the old text. Only a
        draft campaign accepts this: once the campaign opens its requirements are
        frozen. Scoped to the recruiters on the campaign by the same join that
        scopes reading it.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_text]
              properties:
                source_text: { type: string, minLength: 1 }
      responses:
        "200":
          description: The requirements extracted from the job description.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementList"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The campaign has opened, so its requirements are frozen.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [recruiting]
      operationId: listRequirements
      x-prepeet-capability: campaign.read
      summary: The requirements extracted for a campaign
      description: |
        The campaign's requirements in the order they were extracted, each with
        its provenance span and its state: proposed until a recruiter acts,
        corrected when they edit it, rejected when they remove it. Scoped to the
        recruiters on the campaign.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The requirements, in source order.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/requirements/{requirementId}:
    patch:
      tags: [recruiting]
      operationId: correctRequirement
      x-prepeet-capability: campaign.read
      summary: Correct or reject an extracted requirement
      description: |
        A recruiter fixes an extracted requirement's wording or rejects one that
        should not be judged against. The provenance span is untouched: where a
        requirement came from does not change when its wording is fixed. Only
        while the campaign is a draft; once it opens the requirements are frozen.
        Scoped to the campaign, so a recruiter cannot rewrite another campaign's
        requirement by its id.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requirementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                text:
                  type: string
                  description: The corrected wording. Omitted or empty leaves the text unchanged.
                status:
                  type: string
                  enum: [corrected, rejected]
      responses:
        "200":
          description: The requirement, as it now stands.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The campaign has opened, so its requirements are frozen.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/candidates:
    get:
      tags: [recruiting]
      operationId: listCampaignCandidates
      x-prepeet-capability: campaign.read
      summary: The candidate roster for a campaign
      description: |
        Every candidate the campaign has invited, each with where they stand:
        from the invitation's own state, through an interview in progress, to
        a completed screening awaiting a human review. Scoped to the
        recruiters on the campaign by the same join that scopes the campaign
        itself, and filtered server-side by the standing parameter, never by
        hiding rows in a browser.

        This is a roster, not a ranking. Rows order by invitation recency
        alone; a candidate whose session produced insufficient evidence is
        shown as exactly that, its own named standing awaiting the same
        human review, never a low scorer sorted to the bottom; and no field
        here orders candidates by quality, because REV-01's rule is the
        product's: evidence first, decision second, and the decision belongs
        to a named person.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: standing
          in: query
          required: false
          description: Answer only the candidates at this standing.
          schema:
            $ref: "#/components/schemas/RosterStanding"
      responses:
        "200":
          description: The roster, newest invitation first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRoster"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/sessions/{sessionId}/review:
    get:
      tags: [recruiting]
      operationId: getScreeningReview
      x-prepeet-capability: evaluation.read_screen
      x-prepeet-sensitive-read: true
      summary: The evidence-first review of one completed screening
      description: |
        Everything a reviewer weighs, framed as evidence rather than a
        verdict: the pinned configuration the session actually ran,
        competencies with their confidence and reason codes beside every
        band rather than in a footnote, the evidence spans with quotes and
        room-clock timestamps, coverage by name, neutral contradictions and
        unverified claims, and each job requirement as evidenced, partial,
        not discussed or not assessable with a suggested human follow-up
        where evidence is missing.

        Deliberately absent, by contract: any recommendation, suggestion,
        advance/decline hint or headline number. The decision belongs to
        the reviewer, and a response field that hinted at one would be the
        platform quietly making it. Reading this is a recorded event
        (REV-04): the audit row commits before the response is written, and
        a read that cannot be recorded is refused.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The review, evidence first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningReview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            REVIEW_NOT_READY: the session exists on this campaign and its
            evaluation has not been published yet.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/sessions/{sessionId}/decisions:
    get:
      tags: [recruiting]
      operationId: listReviewDecisions
      x-prepeet-capability: evaluation.read_screen
      summary: The decision history for one screening
      description: |
        Every decision ever recorded on the session, oldest first, each
        with its true actor, its reason, its overrides and the evidence
        version it was informed by. Append-only by trigger: a change of
        mind is a new decision, and the history keeps them all - which is
        what an appeal reads.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The history, oldest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [recruiting]
      operationId: recordReviewDecision
      x-prepeet-capability: evaluation.review
      summary: Record a named human's decision on one screening
      description: |
        Advance, reject or hold, with a required reason. The decider is
        the session, never the body: no code path can produce an outcome
        without a named human actor. The evidence version - the published
        evaluation's identity and digests - is captured server-side at the
        moment of deciding, and where the reviewer disagrees with an
        assessed band the override carries the reviewer's band and a
        required rationale; the band disagreed with is recorded from the
        stored result, never taken from the request.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "201":
          description: The decision, recorded and announced.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Refused with a distinct code: REVIEW_NOT_READY when no
            evaluation is published to decide against, REASON_REQUIRED,
            OVERRIDE_INCOMPLETE for an override missing its rationale or
            band, OVERRIDE_UNKNOWN_COMPETENCY for one naming a competency
            the evaluation did not assess.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/sessions/{sessionId}/re-reviews:
    get:
      tags: [recruiting]
      operationId: listReReviews
      x-prepeet-capability: evaluation.read_screen
      summary: The appeals raised on one screening
      description: |
        Every re-review on the session, oldest first: who asked and why,
        the evidence and configuration frozen at the moment of raising,
        who is assigned, the answer-by time, and the resolution once one
        exists.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The appeals, oldest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReReviewList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [recruiting]
      operationId: raiseReReview
      x-prepeet-capability: appeal.raise
      summary: Raise a re-review of the latest decision
      description: |
        Opens an appeal against the session's latest recorded decision,
        freezing what that decision was informed by at this very moment:
        the evaluation's identity and digests, and the bundle the session
        ran. A later re-evaluation or a newer decision never moves the
        freeze - a re-review that read newer evidence than the decision
        did would be reviewing a different question and calling it the
        same one. The requester is the session, never the body.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201":
          description: The appeal, raised with its freeze.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReReviewView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            APPEAL_NO_DECISION when nothing has been decided to appeal, or
            REASON_REQUIRED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/re-reviews/{reReviewId}/assignment:
    post:
      tags: [recruiting]
      operationId: assignReReview
      x-prepeet-capability: appeal.manage
      summary: Assign who answers an open re-review
      description: |
        Names the reviewer who answers. The original reviewer is refused
        by name and by the schema's own constraint: the one person who
        cannot re-review a decision is the person who made it.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: reReviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: string, format: uuid }
      responses:
        "200":
          description: The appeal, assigned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReReviewView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: SELF_REVIEW_FORBIDDEN or APPEAL_RESOLVED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/re-reviews/{reReviewId}/resolution:
    post:
      tags: [recruiting]
      operationId: resolveReReview
      x-prepeet-capability: appeal.manage
      summary: Resolve an open re-review, once
      description: |
        The assigned reviewer's answer, whole or not recorded: the outcome
        (upheld or revised), the rationale, and the disclosure the
        candidate is permitted. Only the assigned reviewer resolves, the
        original reviewer never can, and a resolved re-review is immutable
        by trigger. A revision changes nothing here: the revised outcome
        is a NEW decision recorded through the append-only decision path.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: reReviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, rationale, disclosure]
              properties:
                outcome:
                  type: string
                  enum: [upheld, revised]
                rationale: { type: string }
                disclosure:
                  type: string
                  description: What the candidate is permitted to be told.
      responses:
        "200":
          description: The appeal, resolved.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReReviewView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            APPEAL_RESOLVED, RESOLVER_NOT_ASSIGNED, SELF_REVIEW_FORBIDDEN
            or RESOLUTION_INCOMPLETE.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/invitations:
    get:
      tags: [recruiting]
      operationId: listInvitations
      x-prepeet-capability: campaign.read
      summary: The invitations issued for a campaign
      description: |
        The roster for one campaign, newest first, each with where it stands
        and whether its email arrived. Scoped to the recruiters on the campaign
        by the same join that scopes reading the campaign itself, not by the
        capability: invitation.read is scoped to a campaign and Authorize names
        no scope yet, so the join is the enforcement, exactly as it is for the
        campaign.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The invitations, newest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [recruiting]
      operationId: issueInvitation
      x-prepeet-capability: campaign.read
      summary: Invite a candidate to the campaign
      description: |
        Mints a single-use, expiring link and emails it. Only the hash is
        stored; the token itself lives for the one call that sends it and is
        never returned or written. Issuing to a recipient who already holds a
        live link supersedes the old one, so a resend never leaves two working
        links. The campaign must be open: a draft has not fixed the
        configuration a candidate would be interviewed against.

        campaign.read with the join, not invitation.manage: the scoped
        capability is intent until scope grants are populated, and the
        recruiter-on-campaign join is what actually admits the caller.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: { type: string, format: email, minLength: 3 }
      responses:
        "201":
          description: The invitation, issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The campaign is not open, so it may not issue invitations.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/invitations/{invitationId}/revoke:
    post:
      tags: [recruiting]
      operationId: revokeInvitation
      x-prepeet-capability: campaign.read
      summary: Stop a live invitation
      description: |
        Stops the link from being accepted. It does not delete the invitation,
        the campaign, or anything the candidate has already done: the record
        that the invitation was issued remains, now marked revoked. Revoking a
        link that was already accepted, declined or revoked is refused rather
        than silently rewritten, because the ending it already has is a fact.
        Scoped to the named campaign, so a recruiter on one campaign cannot
        revoke another's invitation by its id.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The invitation, now revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such live invitation on this campaign to revoke.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/invitations/{invitationId}/resend:
    post:
      tags: [recruiting]
      operationId: resendInvitation
      x-prepeet-capability: campaign.read
      summary: Send a fresh link to the same recipient
      description: |
        The recovery path when an email did not arrive: mints a new link to the
        same recipient and supersedes the old one, so the recipient never holds
        two working links. Refused for an invitation the candidate has already
        accepted or declined, and for one already revoked, because a resend
        there would hand a new link to someone whose answer is already
        recorded. Returns the fresh invitation, with its own delivery status.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The fresh invitation, issued to the same recipient.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such invitation on this campaign.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The invitation has an ending that a resend must not overwrite.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /screening/invitation/resolve:
    post:
      tags: [recruiting]
      operationId: resolveScreeningInvitation
      x-prepeet-capability: public
      summary: Look at an invitation before acting on it
      description: |
        The candidate arrives holding a token and nothing else. This resolves it
        to what they need to decide: who invited them, for what role, and
        whether the link can still be used. A link that has expired, been
        revoked, or already been answered comes back with that outcome and the
        employer who issued it, so the candidate knows who to contact rather
        than meeting a dead end. A token that names no invitation is refused
        without saying more, because a guess must not be told from a real link.

        Nothing is consumed here, and nothing about whether the address has an
        account is revealed: resolving is only reading.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "200":
          description: The invitation, live or with its terminal outcome and who to contact.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningInvitationView"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: The token names no invitation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /screening/invitation/accept:
    post:
      tags: [recruiting]
      operationId: acceptScreeningInvitation
      x-prepeet-capability: public
      summary: Accept an invitation and sign in
      description: |
        Consumes the invitation, single use, and signs the candidate in with the
        same cookies a login sets. Arriving with the token proves control of the
        address it was sent to, so a candidate with no account is given a
        passwordless one and a candidate who already has an account is signed
        into it: the response is the same either way, and never reveals which it
        was. A link that has expired, been revoked or already been answered is
        refused with its own code, and resolving it again shows who to contact.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "200":
          description: Accepted and signed in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              description: Session and refresh cookies, HTTP-only and SameSite.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: The token names no invitation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The invitation is expired, revoked or already answered, so it cannot be accepted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /screening/invitation/decline:
    post:
      tags: [recruiting]
      operationId: declineScreeningInvitation
      x-prepeet-capability: public
      summary: Decline an invitation
      description: |
        Records the candidate's no. It is a first-class outcome and carries no
        penalty: the invitation ends as declined and nothing downstream treats a
        decline differently from never having been asked. Single use, guarded the
        same way accept is, so declining a link already answered changes nothing.
        No account is created and no session is issued: declining is the end of
        the candidate's involvement, not the start of it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenConfirmRequest"
      responses:
        "200":
          description: Declined.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningInvitationView"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: The token names no invitation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The invitation is expired, revoked or already answered, so it cannot be declined.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /screening/accommodations:
    post:
      tags: [recruiting]
      operationId: requestAccommodation
      x-prepeet-capability: session.participate
      summary: Ask for an adjustment to how the interview is conducted
      description: |
        A candidate asks for a named adjustment: captions, push-to-talk, extra
        thinking time, or the alternative path for when voice is not accessible.
        It is requestable before the interview and during preparation; once the
        interview is underway a need becomes an incident, not a request, and is
        refused here with a route to that path. The adjustment is chosen from a
        fixed vocabulary, never free text: a form that let a candidate explain
        why is a form that asks for a medical condition, so there is no field
        for one. The authority is the candidate's accepted invitation to the
        campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, adjustment]
              properties:
                campaign_id: { type: string, format: uuid }
                adjustment:
                  type: string
                  enum: [captions, push_to_talk, extra_time, alternative_path]
      responses:
        "201":
          description: The request, recorded, with its state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The interview is underway or over; an accommodation need now goes to the incident path.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [recruiting]
      operationId: listAccommodations
      x-prepeet-capability: session.participate
      summary: The candidate's own accommodation requests for a campaign
      description: |
        Each request the candidate made for the campaign, with its state:
        requested until somebody answers, then granted or declined. The authority
        is the candidate's accepted invitation.
      parameters:
        - name: campaignId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The candidate's accommodation requests.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/candidates/{candidateId}/re-invitation:
    post:
      tags: [recruiting]
      operationId: authorizeReInvitation
      x-prepeet-capability: campaign.read
      summary: Let a candidate take the interview again
      description: |
        A recruiter's decision to let one candidate take one further screening
        session, with the reason recorded. The platform never re-invites on its
        own initiative: this is the named human decision that authorizes a
        restart, and each authorization admits exactly one further attempt. The
        decider is the recruiter's own session, never the body. The interrupted
        session's evidence is retained separately and never merged. Scoped to the
        recruiters on the campaign by the same join that scopes the rest of it.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: candidateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                interrupted_session: { type: string, format: uuid }
      responses:
        "204":
          description: Authorized. The candidate may take the interview once more.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/accommodations/{requestId}/decision:
    post:
      tags: [recruiting]
      operationId: decideAccommodation
      x-prepeet-capability: campaign.read
      summary: Grant or decline an accommodation request
      description: |
        A recruiter on the campaign answers a request. The answer names the
        human who made it, because an accommodation decision from nobody is not
        one somebody can be accountable for; the session records the recruiter
        from their session, never the body. A change of mind is a new decision,
        not an edit: the latest answer stands, and the history remains. Scoped to
        the campaign by the same join that scopes reading it.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: { type: boolean }
      responses:
        "204":
          description: Recorded. The candidate's next read reflects it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /screening/sessions:
    post:
      tags: [recruiting]
      operationId: startScreeningSession
      x-prepeet-capability: session.participate
      summary: Begin the screening interview an accepted invitation admits
      description: |
        Creates the candidate's screening session for a campaign they accepted
        an invitation to, and records the disclosure version they agreed to. The
        authority is the accepted invitation, checked server-side: a candidate
        who did not accept an invitation to the campaign is answered exactly like
        one naming a campaign that does not exist, so a candidate cannot start a
        session against a campaign they were never invited to, and existence is
        not leaked to one who was not.

        The session is composed against the campaign's pinned configuration, not
        the platform default. The consent decisions the candidate makes are
        recorded with the acceptance; the required-consent gate activates once a
        campaign configures the purposes it asks about, which is its own work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, disclosure_version, disclosure_digest]
              properties:
                campaign_id: { type: string, format: uuid }
                disclosure_version: { type: string, minLength: 1 }
                disclosure_digest:
                  type: string
                  description: The sha256 digest of the exact disclosure text the candidate was shown.
                  pattern: "^sha256:[0-9a-f]{64}$"
                consents:
                  type: array
                  description: The candidate's answer to each purpose the disclosure asked about.
                  items:
                    type: object
                    required: [purpose, granted]
                    properties:
                      purpose: { type: string }
                      granted: { type: boolean }
      responses:
        "201":
          description: The screening session, composing against the campaign's configuration.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningSession"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The campaign is not open, so it admits no new sessions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /screening/sessions/{sessionId}/result:
    get:
      tags: [recruiting]
      operationId: getScreeningResult
      x-prepeet-capability: session.read_screen_confirmation
      summary: What a screening candidate may see of their own result
      description: |
        The candidate's view of their screening interview, filtered server-side
        to what the campaign's jurisdiction determination permits (ADR-0020).
        The determination the campaign pinned at open decides the level, from
        most to least disclosing: full_evaluation, evidence_without_band,
        completion_status, submission_only. A level the server does not
        recognise is served as submission_only, because a disclosure decision
        this endpoint cannot read is one it must not guess upward.

        Coaching, recruiter notes, comparison and hiring decisions are not
        filtered out of this response; they are absent from its schema at every
        level, so no level and no bug in level selection can include them.
        A session that is not the caller's own screening session is not found,
        and existence is not answered across candidates.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The permitted view, and nothing more.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningResult"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/settings:
    get:
      tags: [tenant]
      operationId: getTenantSettings
      x-prepeet-capability: tenant.settings_read
      summary: How this workspace is configured
      description: |
        Reading is a lesser authority than changing, and every membership role
        holds it. A viewer, whose whole role is oversight without authority,
        needs to see the defaults their colleagues' work happens under: which
        rubric a campaign starts from, what a candidate is told, how long
        anything is kept.

        The response says whether the caller may change what they are reading,
        so the screen can render the same document with or without controls
        rather than guessing from a role name it would have to keep in step.
      responses:
        "200":
          description: The current configuration and whether this caller may change it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [tenant]
      operationId: saveTenantSettings
      x-prepeet-capability: tenant.settings_manage
      summary: Change how this workspace is configured
      description: |
        The version read is the version changed. A save naming a version other
        than the current one is refused rather than merged, because two
        administrators editing the same document should be told they collided
        rather than have one of them quietly lose their work.

        Defaults apply to campaigns opened afterwards and never retroactively,
        which is a property of how a campaign pins its configuration rather
        than a rule this endpoint enforces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, settings]
              properties:
                version:
                  type: integer
                  description: The version this change was made against.
                settings:
                  $ref: "#/components/schemas/TenantSettingsDocument"
      responses:
        "200":
          description: The saved configuration, at its new version.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Somebody else changed the settings first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tenant/usage:
    get:
      tags: [tenant]
      operationId: getTenantUsage
      x-prepeet-capability: tenant.billing_read
      summary: What the workspace has used, in the invoice's own terms
      description: |
        Counts from the append-only ledger: started sessions, credits (early
        abandons and platform interruptions, per ADR-0014), and the billable
        difference. Needs tenant.billing_read.
      responses:
        "200":
          description: The usage counts.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/quota:
    get:
      tags: [tenant]
      operationId: getTenantQuota
      x-prepeet-capability: tenant.billing_read
      summary: The limit, what remains, and where the warning stands
      description: |
        Approaching and reaching the limit both warn here before anything is
        blocked; at the limit only new starts are refused, and an interview
        already running is never touched. Needs tenant.billing_read.
      responses:
        "200":
          description: The quota position.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /interviews/{sessionId}/start:
    post:
      tags: [interview]
      operationId: startInterview
      x-prepeet-capability: session.participate
      summary: Start a ready session and receive the room grant
      description: |
        Quota is reserved before anything spends (screening only; practice
        has no tenant quota), the session moves to connecting, and the
        response carries a short-lived room grant scoped to exactly this
        session and this identity. Each refusal is its own code: an expired
        session, one already started, one not yet ready, and a workspace at
        its limit are different situations with different next actions.
        Somebody else's session is not found, because existence is not
        answered across owners.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session, connecting, with its join grant.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedInterview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Refused with a distinct code: SESSION_EXPIRED,
            SESSION_ALREADY_STARTED, SESSION_NOT_READY or QUOTA_EXHAUSTED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/resume:
    post:
      tags: [interview]
      operationId: resumeInterview
      x-prepeet-capability: session.participate
      summary: Resume a dropped session into a fresh connection attempt
      description: |
        Opens the next connection epoch for a session the caller lost:
        a reconnecting session inside its grace window, an in-progress
        session whose drop the server has not seen yet (a refresh, a
        sleeping laptop), or a connecting one whose first attempt died
        before it opened. The answer carries a fresh short-lived room
        grant, the stamped timing policy, and the recovery cursor: the
        epoch the browser must speak now, plus what the previous epoch
        durably holds and the exact gaps still owed, so the client
        resends missing durable events and rebuilds itself by replay
        rather than trusting its own memory. The superseded tab's next
        batch is refused whole with EPOCH_STALE; one candidate holds one
        live connection. A reconnecting session past its grace window is
        refused with GRACE_EXPIRED: expiry finalizes what was captured,
        it does not restart the interview.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The next attempt, with its recovery cursor.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumedInterview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Refused with a distinct code: SESSION_NOT_RESUMABLE for a
            session with no interview in flight, GRACE_EXPIRED for one
            whose reconnection window has lapsed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/events:
    post:
      tags: [interview]
      operationId: ingestControlEvents
      x-prepeet-capability: session.participate
      summary: Send a batch of control events for the current epoch
      description: |
        Ordered by sequence within the epoch, deduplicated by event id, and
        answered with the accepted contiguous cursor plus the exact gaps
        still owed. A batch from a superseded epoch is refused whole with
        EPOCH_STALE: a stale tab must not write history into a session that
        has moved on. Ephemeral types (partial captions, input levels) are
        acknowledged and never stored.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlEventBatch"
      responses:
        "200":
          description: The acknowledgment.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAcknowledgment"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EPOCH_STALE or NO_ATTEMPT, whole-batch refusals.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [interview]
      operationId: replayControlEvents
      x-prepeet-capability: session.participate
      summary: Replay the durable timeline after a cursor
      description: |
        Everything after (after_epoch, after_sequence), in the one
        authoritative order. Replaying twice from the same cursor answers
        identically; a reconnecting client rebuilds itself on that property.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: after_epoch
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: after_sequence
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: The events after the cursor.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlEventList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interviews/{sessionId}/transcript:
    get:
      tags: [interview]
      operationId: getTranscript
      x-prepeet-capability: session.read_own_practice
      # authorization-model.md: "Reading transcript/audio is independently
      # authorized and audited." Declared here rather than decided in the
      # handler, so a new read path is audited by saying so rather than by its
      # author remembering, and so the obligation is reviewable in the document
      # that states it.
      x-prepeet-sensitive-read: true
      summary: The assembled transcript, provenance included
      description: |
        Every version stands: a correction supersedes a segment's effective
        text while the original stays underneath with its own sequence and
        timing, linked both ways. Word-level timing rides each final segment
        on the room's single clock, and confidence is per segment. Dangling
        corrections are listed, not hidden.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The transcript.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interviews/{sessionId}/results:
    get:
      tags: [interview]
      operationId: getResults
      x-prepeet-capability: session.read_own_practice
      summary: The evaluation result, sufficiency and coverage included
      description: |
        One immutable result per session, judged by the rubric the session
        PINNED at composition, whose reference, version and digest are
        echoed here. Insufficient evidence is its own outcome: an
        unassessed competency carries a reason - NOT_DISCUSSED when the
        conversation never reached it, INSUFFICIENT_EVIDENCE when it did
        but too thinly - and never a band. There is no overall score:
        nothing here averages unassessed as zero.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The stored result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResultView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: RESULT_NOT_READY while evaluation has not landed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/delivery:
    get:
      tags: [interview]
      operationId: getDelivery
      x-prepeet-capability: session.read_own_practice
      summary: The delivery analysis, measured and gated
      description: |
        Deterministic measurements, the ten-dimension profile with its
        evidence, and fact-preserving coaching, exactly as the articulation
        workflow stored them. No aggregate delivery score exists here. A
        not-assessable delivery says plainly that it is not a low result
        and has affected no score. DELIVERY_NOT_READY while the analysis
        has not landed.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The analysis.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: DELIVERY_NOT_READY while the analysis has not landed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/delivery/feedback:
    put:
      tags: [interview]
      operationId: recordInsightFeedback
      x-prepeet-capability: session.read_own_practice
      summary: Say whether a generated insight described you
      description: |
        A thumbs up or down on one generated strength, priority or drill.
        Idempotent by design: the same insight answered again replaces the
        previous answer rather than adding a second opinion from the same
        person about the same sentence, so pressing the other thumb is a
        correction.

        It changes nothing the candidate is shown. The verdict is a report
        about the coaching, recorded against the artifact digest and policy
        version that produced the insight so a drop in helpfulness is
        attributable to a version rather than to a date.

        Practice only. A screening candidate rating their own assessment
        would be a channel for pressure, so a screening session refuses
        with FEEDBACK_PRACTICE_ONLY.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightFeedbackRequest"
      responses:
        "204":
          description: Recorded. Nothing is returned, because nothing changed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: FEEDBACK_PRACTICE_ONLY on a screening session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/turns/{turnId}/redos:
    post:
      tags: [interview]
      operationId: createRedo
      x-prepeet-capability: session.create_practice
      summary: Retake one answer as a new, linked practice session
      description: |
        Creates a practice session composed from this session's own
        configuration plus the one question the turn answered. The
        original session, its transcript, its evidence and its timing are
        never modified: the retake is a different session, linked here.
        One retake per question; practice only; only once results exist.
        Refusals: REDO_NOT_ALLOWED, REDO_EXISTS, REDO_TURN_UNKNOWN.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: turnId
          in: path
          required: true
          description: The sequence of the candidate's answer to retake.
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: The retake session, in draft, ready to compose.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: REDO_NOT_ALLOWED, REDO_EXISTS or REDO_TURN_UNKNOWN.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /interviews/{sessionId}/review:
    get:
      tags: [interview]
      operationId: getReview
      x-prepeet-capability: session.read_own_practice
      summary: The coaching review, derived and fact-preserving
      description: |
        Per-answer strengths, gaps and a suggested rewrite assembled only
        from the candidate's own sentences plus bracketed questions where
        information is missing - a rewrite never adds a fact. Coaching is
        derived from the stored evidence, so a coaching failure leaves the
        evaluation untouched: coaching_available says so honestly and the
        results endpoint keeps answering.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The review, or the honest absence of one.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewView"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: RESULT_NOT_READY while evaluation has not landed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/interviews/{sessionId}/events:
    post:
      tags: [internal]
      operationId: ingestServiceEvents
      x-prepeet-capability: service
      summary: The agent writes conversation into the durable timeline
      description: |
        The voice agent is the transcript's source of truth (ADR-0019). It
        names the session and the candidate it heard - the candidate is the
        room participant's identity - and the server stamps the current
        epoch and assigns the next sequences itself, so two writers never
        share a numbering. Same validation and seal rules as the browser
        path: a segment that cannot serve as evidence is refused by name,
        and a sealed transcript takes no more conversation.
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceEventBatch"
      responses:
        "200":
          description: Per-event outcomes and the cursor as it now stands.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAcknowledgment"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: NO_ATTEMPT while no connection epoch is open.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/interviews/{sessionId}/brief:
    get:
      tags: [internal]
      operationId: getInterviewBrief
      x-prepeet-capability: service
      summary: What the interviewer needs to run this session
      description: |
        The agent's brief, assembled from the session's own pins: the
        persona and role by name, the configured length, and the plan body
        resolved by the digest the bundle pinned - never the catalogue's
        current head. The candidate and mode come from the room, and scope
        the read exactly as the owner's own would.
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: candidate_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: true
          schema: { type: string, enum: [practice, screening] }
      responses:
        "200":
          description: The brief.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewBrief"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interviews/{sessionId}/complete:
    post:
      tags: [interview]
      operationId: completeInterview
      x-prepeet-capability: session.participate
      summary: Seal the transcript and hand the session to evaluation
      description: |
        Idempotent to the receipt: completing twice with the same final
        cursor answers the same seal and causes no second evaluation, while
        a different cursor is SEAL_CONFLICT. Gaps under the final cursor
        are recorded, never silently closed, and missing optional media
        continues to evaluation with an explicit warning attached.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInterviewRequest"
      responses:
        "200":
          description: The receipt, identical however many times it is asked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionReceipt"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: SESSION_NOT_RUNNING, SEAL_CONFLICT or EPOCH_STALE.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/progression/skills:
    get:
      tags: [progression]
      operationId: getMySkills
      x-prepeet-capability: candidate.practice.read_own
      summary: The caller's competencies, each with the evidence and its age
      description: |
        Every competency the caller has been observed on, with the readings
        behind it and how current each one is. Freshness is served rather
        than left to the browser to work out, because "solid" from six
        months ago and "solid" from last week are different claims and a
        screen that computes the difference itself is a screen that can stop
        computing it.

        A competency never observed is returned with standing `none` rather
        than omitted or scored zero. Never measured and measured badly are
        different facts about a candidate, and collapsing them would make an
        unasked question look like a failed one.
      responses:
        "200":
          description: One entry per competency, ordered by discipline then role.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillHistory"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/progression/readiness:
    get:
      tags: [progression]
      operationId: getMyReadiness
      x-prepeet-capability: candidate.practice.read_own
      summary: Readiness per role, each against the standard that judged it
      description: |
        One readiness per role, and never a figure across roles. Each names
        the role standard, its version and its digest, because a readiness
        that cannot say what judged it cannot be audited or reproduced.

        Roles are returned as a list rather than reduced to a number on
        purpose: a backend engineer's readiness and a nurse's are not
        comparable quantities, and there is deliberately no field anywhere
        in this response that could hold an average of them.
      responses:
        "200":
          description: One entry per role, ordered by discipline then role.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessByRole"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/delivery-baseline:
    get:
      tags: [interview]
      operationId: getDeliveryBaseline
      x-prepeet-capability: candidate.practice.read_own
      summary: The caller's own delivery ranges, once there is enough history
      description: |
        A personal baseline: the middle half of the caller's own measured
        practice sessions, drawn only after a documented minimum and
        never against anyone else's. Practice only by construction: the
        history is read under the candidate's own scope, which cannot see
        a screening analysis. The note states the ranges are guidance,
        not a correct rate.
      responses:
        "200":
          description: The baseline, or the honest absence with its count.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryBaseline"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/sessions:
    get:
      tags: [interview]
      operationId: listMySessions
      x-prepeet-capability: candidate.practice.read_own
      summary: Every session the caller owns, every lifecycle state included
      description: |
        The whole history, newest first: a failed, expired or cancelled
        session is history too, never a hidden row. Practice only today;
        screening participation surfaces arrive with their epic.
      responses:
        "200":
          description: The sessions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me:
    get:
      tags: [authentication]
      operationId: getCurrentUser
      x-prepeet-capability: authenticated
      summary: Describe the authenticated user and their active tenant
      description: |
        Returns the user, whether their address is verified, their tenant
        memberships and which tenant is currently active.

        Memberships are listed because a user may belong to several tenants and
        the interface lets them switch. Listing a membership is not a statement
        about what it permits: that is decided per request by the capability
        layer, and the interface never treats this list as authorization.
      responses:
        "200":
          description: The current user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/memberships:
    get:
      tags: [authentication]
      operationId: listMemberships
      x-prepeet-capability: authenticated
      summary: List the workspaces this person belongs to
      description: |
        The one question that cannot be scoped by tenant, because it is asked
        before a tenant has been chosen. Answered by row-level security keyed on
        the acting user rather than by a filter in the query, so forgetting the
        filter is a missing result rather than another person's memberships.

        Listing a membership is not a statement about what it permits. That is
        decided per request by the capability layer.
      responses:
        "200":
          description: The workspaces this person belongs to, which may be none.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/active-tenant:
    put:
      tags: [authentication]
      operationId: setActiveTenant
      x-prepeet-capability: authenticated
      summary: Choose which workspace this session acts under
      description: |
        Every request operates under exactly one explicit active tenant, and it
        is never inferred from a resource identifier. This is where it is
        chosen, and the only place membership is checked: the selection is
        stored on the session, so later requests read it from a row the client
        cannot reach rather than from something the client sent.

        A null tenant clears the selection, which is how somebody leaves a
        workspace without signing out.

        Both the selection and its refusal are audited. The refusal is the one
        worth keeping: repeated attempts on workspaces somebody does not belong
        to is the shape of an account probing for access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTenantSelection"
      responses:
        "200":
          description: The session now acts under that workspace.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            No active membership of that workspace. Deliberately not 404: the
            workspace may well exist, and saying otherwise to somebody who
            cannot use it would be a way to test which identifiers are real.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: |
        The platform's own automation speaking to itself: the voice agent
        writing the transcript it is the source of. A deployment secret
        compared in constant time, never a person's credential, and only
        the internal-tagged operations accept it.
    sessionCookie:
      type: apiKey
      in: cookie
      name: prepeet_session
      description: |
        An opaque session token, stored hashed server side so a database read
        yields nothing presentable. Opaque rather than a JWT because membership
        revocation must take effect within seconds. See ADR-0003.

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: Which configured provider, as listed by /auth/oauth/providers.
      schema:
        type: string
        maxLength: 40
        pattern: "^[a-z][a-z0-9_-]*$"
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FactId:
      name: factId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Scoped to tenant, endpoint and key together. A replay carrying the same
        body returns the stored response; a replay carrying a different body is
        409, because two different requests under one key is a client bug that
        silently succeeding would hide.
      schema:
        type: string
        format: uuid

  headers:
    CacheControl:
      description: |
        What an intermediary may do with this response, per the caching
        conventions in ADR-0004.

        Declared on every response rather than left to the server, because a
        cacheability that exists only in a handler is a property nobody can
        review and no client can rely on. What the server actually sends is
        asserted against this document, so the two cannot drift.
      required: true
      schema:
        type: string

  responses:
    Forbidden:
      description: The session holds no capability covering this.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MemberConflict:
      description: The membership is not in a state this operation applies to, or changed since it was read.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: |
        Nothing at this identifier in this scope - which deliberately covers
        both absence and somebody else's resource, so an identifier cannot be
        used to test what exists.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationFailed:
      description: The request was malformed or failed validation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session was presented.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: The idempotency key was reused with a different request body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ResendCoolingDown:
      description: |
        A recent email for this flow is on its way. The refusal carries the
        cooldown twice, in Retry-After and in the body, so the interface shows
        a countdown rather than a bare error.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          description: Seconds until the next email may be requested.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TokenRefused:
      description: |
        The token was not consumed, and the code says exactly why: invalid,
        expired, already used, superseded by a newer email, incorrect, or
        exhausted by wrong guesses. The prototype gives each its own screen,
        which only works if the response distinguishes them.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DocumentStateConflict:
      description: |
        The document is not in a state this operation applies to: completing
        an aborted upload, deleting twice. The current state is in the list
        response; nothing was changed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable and never reused for a different meaning. Generated into both
        clients as an enum, so a client can handle codes exhaustively and a new
        one is a compile-time prompt rather than a runtime surprise.

        Messages are for humans and may be reworded at any time. Only the code
        is machine logic.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - CREDENTIALS_INVALID
        - SESSION_EXPIRED
        - REFRESH_TOKEN_REUSED
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_USED
        - TOKEN_SUPERSEDED
        - CODE_INCORRECT
        - CODE_ATTEMPTS_EXHAUSTED
        - RESEND_COOLING_DOWN
        - INTERNAL

    FieldError:
      type: object
      description: One field-level validation failure.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON pointer to the offending field.
          examples: ["/email"]
        code:
          type: string
          examples: ["REQUIRED"]
        message:
          type: string

    Error:
      type: object
      description: The single error envelope every failure in this API uses.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, field_errors, request_id]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human readable, never machine logic.
            retryable:
              type: boolean
              description: Whether retrying the same request could plausibly succeed.
            field_errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
            request_id:
              type: string
              description: |
                Correlation identifier, also returned in X-Request-ID. It is
                what makes a user's support report resolvable to one trace.
              examples: ["req_01a0301daa1070009"]

    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]

    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The dependency's name. The reason it failed is never included.
        status:
          type: string
          enum: [ready, unready]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    TokenEmailKind:
      type: string
      description: Which of the four token flows an email is requested for.
      enum: [verify_email, password_reset, magic_link, otp]

    TokenEmailRequest:
      type: object
      description: Asks for one token email.
      required: [kind, email]
      properties:
        kind:
          $ref: "#/components/schemas/TokenEmailKind"
        email:
          type: string
          format: email
          maxLength: 254

    TokenEmailAccepted:
      type: object
      description: The identical answer for a known and an unknown address.
      required: [status]
      properties:
        status:
          type: string
          enum: [email_sent]
          description: Sent if the address holds an account; the response does not say.

    TokenConfirmRequest:
      type: object
      description: Presents one single-use token.
      required: [token]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 128
          description: The token from the email link, exactly as received.

    PasswordResetRequest:
      type: object
      description: Presents a recovery token and the replacement password.
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 512
          description: The new password. The same rules as registration.

    OTPConsumeRequest:
      type: object
      description: Presents an emailed one-time code for the address it went to.
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    Document:
      type: object
      description: One version of one document. Rows outlive their objects.
      required: [id, kind, version, media_type, size_bytes, state, extraction_state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [cv] }
        version: { type: integer, minimum: 1 }
        media_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [uploading, stored, failed, deleted]
          description: Failed and partial uploads keep their own states, recoverably.
        extraction_state:
          type: string
          enum: [none, pending, extracted, unsupported, failed]
          description: |
            Where extraction stands for this version. Informational always:
            unsupported and failed leave the profile fully usable, manually.
        sha256:
          type: string
          description: The content digest, present once stored. What extraction pins.
        created_at: { type: string, format: date-time }
        stored_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }

    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }

    TenantUsage:
      type: object
      required: [started, credited, billable]
      properties:
        started: { type: integer }
        credited:
          type: integer
          description: Early abandons and platform interruptions, per ADR-0014.
        billable:
          type: integer
          description: Started minus credited; the number the unit prices.

    TenantQuota:
      type: object
      required: [billable, warn_threshold, warning]
      properties:
        billable: { type: integer }
        session_limit:
          type: integer
          description: Absent when no limit is configured.
        remaining:
          type: integer
          description: Absent when no limit is configured. Never negative.
        warn_threshold: { type: number }
        warning:
          type: string
          enum: [none, approaching, reached]

    Member:
      type: object
      required: [membership_id, user_id, email, role, status, version, created_at]
      properties:
        membership_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string }
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum: [invited, active, revoked]
        version: { type: integer }
        created_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    TenantRole:
      type: string
      description: |
        The tenant role vocabulary from the capability contract. owner is
        readable but never assignable through this API.
      enum: [owner, admin, recruiter, hiring_manager, viewer]

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, recruiter, hiring_manager, viewer]

    ChangeMemberRoleRequest:
      type: object
      required: [role, expected_version]
      properties:
        role:
          type: string
          enum: [admin, recruiter, hiring_manager, viewer]
        expected_version: { type: integer }

    CompleteInterviewRequest:
      type: object
      required: [connection_epoch, final_sequence]
      properties:
        connection_epoch: { type: integer }
        final_sequence:
          type: integer
          description: The last conversational sequence the client sent.

    CompletionReceipt:
      type: object
      required:
        [session_id, state, sealed_epoch, sealed_sequence, gaps,
         transcript_digest, media_status, warnings, sealed_at]
      properties:
        session_id: { type: string, format: uuid }
        state: { type: string }
        sealed_epoch: { type: integer }
        sealed_sequence: { type: integer }
        gaps:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer }
              to: { type: integer }
        transcript_digest: { type: string }
        bundle_digest: { type: string }
        media_status:
          type: string
          enum: [none_by_choice, missing, finalized]
        warnings:
          type: array
          items: { type: string }
        sealed_at: { type: string, format: date-time }

    EvaluationResultView:
      type: object
      required: [session_id, rubric, aggregation_version, extraction_version,
                 model_version, policy_version, competencies, evidence,
                 coverage, contradictions, framing, delivery, omissions,
                 covered_competencies, total_competencies, result_digest,
                 warnings, created_at]
      properties:
        session_id: { type: string, format: uuid }
        rubric:
          type: object
          required: [reference, version, digest]
          description: The pin the session composed with, not the published head.
          properties:
            reference: { type: string }
            version: { type: string }
            digest: { type: string }
        aggregation_version: { type: string }
        extraction_version: { type: string }
        model_version:
          type: string
          description: The literal none until a model stands behind this contract.
        policy_version: { type: string }
        competencies:
          type: array
          items: { $ref: "#/components/schemas/CompetencyResultView" }
        coverage:
          type: object
          required: [reached, not_reached]
          description: What the conversation reached and what it did not, by name.
          properties:
            reached:
              type: array
              items: { type: string }
            not_reached:
              type: array
              items: { type: string }
        evidence:
          type: array
          description: |
            The stored evidence spans behind the competency results, so
            every score expands to the exact sentences that produced it.
            Joined by the evidence_ids on each competency result.
          items: { $ref: "#/components/schemas/EvidenceSpanView" }
        contradictions:
          type: array
          description: |
            Pairs of statements that appear to conflict, both sides quoted
            with timestamps. Clarification prompts, never judgments: no
            honesty, integrity or credibility inference exists anywhere in
            this pipeline.
          items: { $ref: "#/components/schemas/ContradictionView" }
        framing:
          type: object
          required: [unverified, contradictions, confidence]
          description: |
            Server-supplied copy every surface must show beside these
            concepts. Unverified does not mean untrue; a contradiction is
            something to ask about; confidence is evidence sufficiency,
            never a probability of job success.
          properties:
            unverified: { type: string }
            contradictions: { type: string }
            confidence: { type: string }
        delivery:
          type: object
          required: [status, warnings, note]
          description: |
            Delivery assessability, from its own workflow: assessable,
            partially_assessable, not_assessable, or pending while it has
            not landed. A not-assessable delivery says plainly, in note,
            that it is not a low result and has touched no score above.
          properties:
            status:
              type: string
              enum: [assessable, partially_assessable, not_assessable, pending]
            warnings:
              type: array
              items: { type: string }
            note: { type: string }
        omissions:
          type: array
          description: |
            Optional parts of the evaluation that are not here, and why.
            A required stage is never an omission: a result without one
            does not exist. Budget exhaustion and a failed optional stage
            both appear here, told apart by retryable, so a candidate is
            told either to wait or that this is as complete as it gets.
          items:
            type: object
            required: [stage, reason, retryable, note]
            properties:
              stage: { type: string }
              reason: { type: string }
              retryable: { type: boolean }
              note:
                type: string
                description: Server-supplied words for this omission.
        covered_competencies: { type: integer }
        total_competencies: { type: integer }
        result_digest: { type: string }
        warnings:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    Campaign:
      type: object
      required: [id, name, status, role_reference, jurisdiction, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [draft, open, closed]
          description: |
            A draft accepts configuration and issues nothing; open has frozen
            its configuration and may issue invitations; closed issues nothing
            further but remains readable, because a closed campaign is still a
            hiring record.
        role_reference: { type: string }
        jurisdiction: { type: string }
        opened_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        pins:
          type: array
          description: |
            What the campaign fixed when it opened, by digest. Absent on a
            draft, which has fixed nothing yet.
          items:
            type: object
            required: [type, reference, version, digest]
            properties:
              type: { type: string }
              reference: { type: string }
              version: { type: string }
              digest: { type: string }

    CampaignList:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"

    Requirement:
      type: object
      description: |
        One requirement a screening interview draws on, linked to the span of the
        job description it came from so its origin is auditable.
      required: [id, text, span_start, span_end, status]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        span_start:
          type: integer
          description: Start of the half-open source span [span_start, span_end) this came from.
        span_end: { type: integer }
        status:
          type: string
          enum: [proposed, corrected, rejected]

    RequirementList:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"

    Invitation:
      type: object
      required: [id, campaign_id, recipient, status, issued_at, expires_at, delivery]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        recipient:
          type: string
          format: email
          description: Who the link was sent to. The token itself is never returned; it exists only in the email.
        status:
          type: string
          enum: [live, expired, accepted, declined, revoked, superseded]
          description: |
            Where the invitation stands. `live` can still be accepted; `expired`
            passed its window with nobody acting; `accepted` and `declined` are
            the candidate's answers; `revoked` is the recruiter stopping it;
            `superseded` is a resend that replaced it. Expiry is computed from
            the clock, not stored, so a live link past its window reads expired
            without anything having to flip it.
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        delivery:
          $ref: "#/components/schemas/InvitationDelivery"

    InvitationDelivery:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, sent, bounced, complained, failed, unknown]
          description: |
            What became of the email that carried the link, so a delivery
            failure is visible and a recruiter knows whether to resend. `sent`
            is handed to the transport, not a read receipt; `bounced` and
            `complained` are facts about the address that a resend to it will
            not fix; `failed` is a dead letter a resend may still clear;
            `unknown` is an email whose record is not there.
        attempts:
          type: integer
          description: How many times sending has been tried.
        last_error:
          type: string
          description: The most recent transport failure, when there is one.

    ScreeningReview:
      type: object
      description: |
        The evidence-first review document. It has no recommendation field
        and no aggregate number across competencies or requirements, by
        design rather than by omission.
      required:
        [session_id, pinned, competencies, evidence, coverage,
         contradictions, requirements]
      properties:
        session_id: { type: string, format: uuid }
        pinned:
          type: object
          description: What this session actually ran, by digest.
          required:
            [bundle_digest, rubric, aggregation_version, extraction_version,
             model_version, policy_version]
          properties:
            bundle_digest: { type: string }
            rubric:
              type: object
              required: [reference, version, digest]
              properties:
                reference: { type: string }
                version: { type: string }
                digest: { type: string }
            aggregation_version: { type: string }
            extraction_version: { type: string }
            model_version: { type: string }
            policy_version: { type: string }
        competencies:
          type: array
          description: |
            Each with its confidence, sufficiency counts and reason codes
            in the same object as its band: uncertainty rides beside every
            score, never in a footnote.
          items:
            $ref: "#/components/schemas/CompetencyResultView"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSpanView"
        coverage:
          type: object
          required: [reached, not_reached, covered, total]
          properties:
            reached:
              type: array
              items: { type: string }
            not_reached:
              type: array
              items: { type: string }
            covered: { type: integer }
            total: { type: integer }
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/ContradictionView"
        requirements:
          $ref: "#/components/schemas/RequirementsReport"

    RequirementsReport:
      type: object
      description: |
        EVL-06's mapping: each job requirement on its own, never a match
        percentage. The report has no aggregate field at all.
      required: [map_version, requirements]
      properties:
        map_version: { type: string }
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/RequirementFinding"

    RequirementFinding:
      type: object
      required: [requirement_id, text, status, competencies, evidence_ids]
      properties:
        requirement_id: { type: string, format: uuid }
        text: { type: string }
        status:
          type: string
          description: |
            evidenced is earned; partial means heard but not settled;
            not_discussed is the interview plan's gap and not_assessable
            the interview's - both about the process, never the candidate.
          enum: [evidenced, partial, not_discussed, not_assessable]
        competencies:
          type: array
          items: { type: string }
          description: The links the mapping made, inspectable by name.
        evidence_ids:
          type: array
          items: { type: string }
        follow_up:
          type: string
          description: |
            The suggested human question, present for every status short
            of evidenced.

    ReviewDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [advance, reject, hold]
        reason:
          type: string
          description: Why. Required, with no default.
        overrides:
          type: array
          description: |
            Where the reviewer disagrees with an assessed band. Each names
            the competency, the reviewer's own band and a required
            rationale; the band disagreed with is captured server-side.
          items:
            type: object
            required: [competency_id, band, rationale]
            properties:
              competency_id: { type: string }
              band: { type: string }
              rationale: { type: string }

    BandOverrideView:
      type: object
      required: [competency_id, recorded_band, override_band, rationale]
      properties:
        competency_id: { type: string }
        recorded_band:
          type: string
          description: The band the aggregation assessed, captured at decision time.
        override_band: { type: string }
        rationale: { type: string }

    ReviewDecisionView:
      type: object
      required:
        [id, session_id, decided_by, decision, reason, evaluation_id,
         result_digest, rubric_digest, overrides, decided_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        decided_by:
          type: string
          format: uuid
          description: The person. A user, never a service.
        decision:
          type: string
          enum: [advance, reject, hold]
        reason: { type: string }
        evaluation_id: { type: string, format: uuid }
        result_digest: { type: string }
        rubric_digest: { type: string }
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/BandOverrideView"
        decided_at: { type: string, format: date-time }

    ReviewDecisionList:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/ReviewDecisionView"

    ReReviewView:
      type: object
      required:
        [id, session_id, requested_by, reason, appealed_decision,
         original_reviewer, frozen, raised_at, due_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        reason: { type: string }
        appealed_decision: { type: string, format: uuid }
        original_reviewer:
          type: string
          format: uuid
          description: The one person who cannot answer this appeal.
        frozen:
          type: object
          description: What the appealed decision was informed by, frozen at raise.
          required: [evaluation_id, result_digest, rubric_digest, bundle_digest]
          properties:
            evaluation_id: { type: string, format: uuid }
            result_digest: { type: string }
            rubric_digest: { type: string }
            bundle_digest: { type: string }
        assigned_to: { type: string, format: uuid }
        raised_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        resolution:
          type: object
          description: Present exactly when the appeal is answered.
          required: [outcome, rationale, candidate_disclosure, resolved_by, resolved_at]
          properties:
            outcome:
              type: string
              enum: [upheld, revised]
            rationale: { type: string }
            candidate_disclosure: { type: string }
            resolved_by: { type: string, format: uuid }
            resolved_at: { type: string, format: date-time }

    ReReviewList:
      type: object
      required: [re_reviews]
      properties:
        re_reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReReviewView"

    RosterStanding:
      type: string
      description: |
        Where one invited candidate stands, as a closed vocabulary the
        roster filters on. States before an interview come from the
        invitation (invited, expired, declined, revoked); accepted means an
        account exists and no interview has begun; in_progress and
        processing are the interview's own phases; session_expired is a
        started interview whose session lapsed; awaiting_review is a
        completed screening a human has yet to decide on; and
        insufficient_evidence is a completed screening whose record could
        not support assessment, its own named standing awaiting the same
        human review, never a low score.
      enum:
        - invited
        - expired
        - declined
        - revoked
        - accepted
        - in_progress
        - processing
        - session_expired
        - awaiting_review
        - insufficient_evidence

    RosterEntry:
      type: object
      required: [invitation_id, recipient, standing, invited_at]
      properties:
        invitation_id: { type: string, format: uuid }
        recipient: { type: string, format: email }
        standing:
          $ref: "#/components/schemas/RosterStanding"
        invited_at: { type: string, format: date-time }
        session_id:
          type: string
          format: uuid
          description: Present once the candidate's screening session exists.
        submitted_at:
          type: string
          format: date-time
          description: When the completed screening became reviewable.

    CampaignRoster:
      type: object
      required: [candidates, pending_review]
      properties:
        pending_review:
          type: integer
          description: |
            How many completed screenings await a human review, the
            insufficient-evidence ones included: absence of evidence is
            still a decision a person has to make.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"

    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    Accommodation:
      type: object
      description: |
        One accommodation request as the candidate sees it. The adjustment is a
        named change to how the interview runs, never a reason or a diagnosis.
      required: [id, adjustment, state, requested_at]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        adjustment:
          type: string
          enum: [captions, push_to_talk, extra_time, alternative_path]
        state:
          type: string
          enum: [requested, granted, declined]
          description: requested until a recruiter answers, then granted or declined.
        requested_at: { type: string, format: date-time }
        decided_at:
          type: string
          format: date-time
          description: When somebody answered. Absent while the state is requested.

    AccommodationList:
      type: object
      required: [accommodations]
      properties:
        accommodations:
          type: array
          items:
            $ref: "#/components/schemas/Accommodation"

    ScreeningSession:
      type: object
      description: The candidate's screening session, just created.
      required: [session_id, state]
      properties:
        session_id: { type: string, format: uuid }
        state:
          type: string
          description: The lifecycle state; a freshly created session is composing.

    ScreeningResult:
      type: object
      description: |
        A screening candidate's view of their own result, already filtered to
        the campaign determination's disclosure level. Coaching, recruiter
        notes, comparison and hiring decisions have no fields here at all:
        their absence is structural, not a filter that could fail open.
      required: [status, disclosure]
      properties:
        status:
          type: string
          enum: [submitted, in_progress, completed, evaluated]
          description: |
            How far the interview got, at the honesty the level permits:
            submission_only always answers `submitted`, because even completion
            is not disclosed there.
        disclosure:
          type: string
          enum: [submission_only, completion_status, evidence_without_band, full_evaluation]
          description: The level that was applied, so the candidate is told why they see what they see.
        competencies:
          type: array
          description: Present from evidence_without_band up. Bands appear only at full_evaluation.
          items:
            type: object
            required: [competency_id, status, evidence_count]
            properties:
              competency_id: { type: string }
              status: { type: string }
              evidence_count: { type: integer }
              band:
                type: string
                description: Only at full_evaluation, and only for assessed competencies.
        evidence:
          type: array
          description: The candidate's own words behind the assessment, from evidence_without_band up.
          items:
            type: object
            required: [competency_id, quote, disposition]
            properties:
              competency_id: { type: string }
              quote: { type: string }
              disposition: { type: string }
        coverage:
          type: object
          description: From evidence_without_band up.
          required: [covered, total]
          properties:
            covered: { type: integer }
            total: { type: integer }

    ScreeningInvitationView:
      type: object
      description: |
        An invitation as the candidate holding its token sees it: who invited
        them, for what, and whether it can still be used. It never carries the
        token or anything about whether the address has an account.
      required: [status, employer]
      properties:
        status:
          type: string
          enum: [live, expired, revoked, accepted, declined, superseded]
          description: |
            Whether the link can still be acted on. `live` can be accepted or
            declined; every other value is terminal and the employer is the
            route from here.
        employer:
          type: string
          description: The workspace that issued the invitation, so a candidate meeting a dead link knows who to contact.
        role:
          type: string
          description: The role the invitation is for.
        campaign_id:
          type: string
          format: uuid
          description: Present while the link is live, for the flow that follows acceptance.
        expires_at:
          type: string
          format: date-time
          description: When a live link stops working.

    TenantSettings:
      type: object
      required: [version, editable, settings]
      properties:
        version:
          type: integer
          description: |
            Zero for a workspace that has never saved, whose document is the
            platform defaults. Every saved version is 1 or above, and a change
            must name the version it was made against.
        editable:
          type: boolean
          description: |
            Whether this caller holds tenant.settings_manage. Served rather
            than inferred, so a read-only screen is a rendering decision the
            server made rather than one the browser guessed from a role.
        settings:
          $ref: "#/components/schemas/TenantSettingsDocument"
        changed_by: { type: string }
        changed_at: { type: string, format: date-time }

    TenantSettingsDocument:
      type: object
      required: [organisation, defaults, candidate_experience, notifications]
      properties:
        organisation:
          type: object
          required: [legal_name, display_name]
          properties:
            legal_name:
              type: string
              description: The entity that answers for the hiring decision.
            display_name:
              type: string
              description: What a candidate sees on an invitation.
        defaults:
          type: object
          description: What a new campaign starts from. Never applied retroactively.
          additionalProperties: true
        candidate_experience:
          type: object
          additionalProperties: true
        notifications:
          type: object
          additionalProperties: true

    SkillHistory:
      type: object
      required: [competencies]
      properties:
        competencies:
          type: array
          items: { $ref: "#/components/schemas/SkillStanding" }

    SkillStanding:
      type: object
      required: [competency_id, name, discipline, role, standing, evidence]
      properties:
        competency_id: { type: string }
        name: { type: string }
        discipline: { type: string }
        role: { type: string }
        standing:
          $ref: "#/components/schemas/EvidenceStanding"
        band:
          type: string
          description: |
            Absent when the standing is `none`. A competency with no observation
            has no band rather than a low one, and the field is omitted rather
            than empty so a screen cannot render an unasked question as a poor
            answer.
        evidence:
          type: array
          description: |
            The readings behind the standing, newest first. Empty when the
            standing is `none`.
          items: { $ref: "#/components/schemas/SkillEvidence" }

    SkillEvidence:
      type: object
      required: [observed_at, age_days, standing, band, rubric_reference, rubric_version]
      properties:
        observed_at: { type: string, format: date-time }
        age_days: { type: integer }
        standing:
          $ref: "#/components/schemas/EvidenceStanding"
        band: { type: string }
        rubric_reference: { type: string }
        rubric_version: { type: string }

    EvidenceStanding:
      type: string
      enum: [fresh, aging, stale, none]
      description: |
        How current a reading is. `none` means never observed, kept distinct
        from `stale` because never measured and measured long ago are
        different facts about a candidate.

    ReadinessByRole:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: |
            A list, never reduced. Two roles are two answers, and nothing in
            this schema can hold a figure spanning them.
          items: { $ref: "#/components/schemas/RoleReadiness" }

    RoleReadiness:
      type: object
      required:
        [role, discipline, standard_reference, standard_version,
         standard_digest, computed_at, assessed, unassessed]
      properties:
        role: { type: string }
        discipline: { type: string }
        standard_reference: { type: string }
        standard_version: { type: string }
        standard_digest: { type: string }
        computed_at: { type: string, format: date-time }
        assessed:
          type: array
          description: Competencies with an observation behind them.
          items: { $ref: "#/components/schemas/AssessedCompetency" }
        unassessed:
          type: array
          description: |
            Competencies the standard names that have never been observed. A
            separate list rather than a band of zero, and its item type has no
            band field at all, so a later change cannot start reporting an
            unasked question as a scored answer.
          items: { $ref: "#/components/schemas/UnassessedCompetency" }

    AssessedCompetency:
      type: object
      required: [competency_id, name, band, standing]
      properties:
        competency_id: { type: string }
        name: { type: string }
        band: { type: string }
        standing:
          $ref: "#/components/schemas/EvidenceStanding"

    UnassessedCompetency:
      type: object
      required: [competency_id, name]
      properties:
        competency_id: { type: string }
        name: { type: string }

    DeliveryBaseline:
      type: object
      required: [baseline_version, sessions_measured, minimum_sessions, ready, ranges, note]
      properties:
        baseline_version: { type: string }
        sessions_measured: { type: integer }
        minimum_sessions: { type: integer }
        ready: { type: boolean }
        ranges:
          type: object
          additionalProperties:
            type: object
            required: [low, high]
            properties:
              low: { type: number }
              high: { type: number }
        note: { type: string }

    OAuthProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
          description: |
            Stably ordered, so the sign-in screen does not reorder its buttons
            between requests and make somebody misclick.

    OAuthStartRequest:
      type: object
      properties:
        redirect_to:
          type: string
          maxLength: 500
          description: |
            Where to go once signed in. Validated when it is stored rather
            than when it is read, because an open redirect stored is an open
            redirect.

    OAuthStart:
      type: object
      required: [authorization_url, state]
      properties:
        authorization_url:
          type: string
          description: Where to send the browser.
        state:
          type: string
          description: |
            The anti-forgery value, which comes back in the provider's
            redirect and is presented to the callback. Single-use.

    OAuthSession:
      type: object
      required: [session, redirect_to]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        redirect_to:
          type: string
          description: |
            Where the sign-in was started from, validated when it was stored
            rather than when it is read. Empty when none was given or when the
            one given was refused, in which case the client uses its own
            default.

            Returned rather than acted on: the server cannot navigate a
            browser, and a redirect from a call the client made with fetch
            would not be followed anyway.

    OAuthCallbackRequest:
      type: object
      required: [state, code]
      properties:
        state: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 2048 }

    InsightFeedbackRequest:
      type: object
      required: [insight_kind, insight_key, helpful]
      properties:
        insight_kind:
          type: string
          enum: [strength, priority, drill]
          description: Which kind of generated insight is being answered.
        insight_key:
          type: string
          maxLength: 120
          description: |
            Which one: the dimension a strength or priority was generated
            for, or the drill's key. Stable across a re-read of the same
            analysis, so an answer survives leaving and returning.
        dimension:
          type: string
          maxLength: 120
          description: The dimension it belongs to, where that is not the key itself.
        helpful:
          type: boolean
          description: |
            Whether it described the candidate. False means "this was not
            about me", which is a quality signal; it does not mean "this was
            harsh", and nothing treats it as a request to soften anything.

    InsightVerdict:
      type: object
      required: [insight_kind, insight_key, helpful]
      properties:
        insight_kind:
          type: string
          enum: [strength, priority, drill]
        insight_key: { type: string }
        dimension: { type: string }
        helpful: { type: boolean }

    DeliveryView:
      type: object
      required: [session_id, status, warnings, note, calculation_version,
                 policy_version, analysis, created_at]
      properties:
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [assessable, partially_assessable, not_assessable]
        warnings:
          type: array
          items: { type: string }
        note:
          type: string
          description: Present and plain when not assessable; empty otherwise.
        calculation_version: { type: string }
        policy_version: { type: string }
        analysis:
          type: object
          additionalProperties: true
          description: |
            The stored analysis document: assessability, metrics, per-turn
            features, the ten-dimension profile and the gated coaching.
            Shaped by the calculator named in calculation_version.
        created_at: { type: string, format: date-time }
        insight_feedback:
          type: array
          items:
            $ref: "#/components/schemas/InsightVerdict"
          description: |
            What this candidate has already said about these insights, so the
            screen shows which thumb is pressed rather than asking again.
            Their own answers only, and empty when they have given none.

    ReviewView:
      type: object
      required: [session_id, coaching_version, coaching_available, answers]
      properties:
        session_id: { type: string, format: uuid }
        coaching_version: { type: string }
        coaching_available:
          type: boolean
          description: |
            False when coaching could not be derived or failed its
            fact-preservation gate. The evaluation is intact either way.
        note:
          type: string
          description: Why coaching is unavailable, when it is.
        answers:
          type: array
          items: { $ref: "#/components/schemas/AnswerCoachingView" }

    AnswerCoachingView:
      type: object
      required: [sequence, strengths, gaps, rewrite]
      properties:
        sequence: { type: integer }
        strengths:
          type: array
          items: { $ref: "#/components/schemas/CoachingPointView" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/CoachingPointView" }
        rewrite:
          type: array
          description: Empty when nothing useful would change.
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                type: string
                enum: [quote, placeholder]
              text: { type: string }

    CoachingPointView:
      type: object
      required: [statement, quote]
      properties:
        statement: { type: string }
        quote:
          type: string
          description: The exact words the statement is about.

    EvidenceSpanView:
      type: object
      required: [id, competency_id, kind, quote, segment_sequence,
                 start_ms, end_ms]
      properties:
        id: { type: string }
        competency_id: { type: string }
        kind:
          type: string
          enum: [supporting, contradictory, claim_unverified, gap]
        quote: { type: string }
        segment_sequence: { type: integer }
        start_ms: { type: integer }
        end_ms: { type: integer }

    ContradictionView:
      type: object
      required: [topic, side_a, side_b]
      properties:
        topic:
          type: array
          items: { type: string }
          description: The shared subject tokens that made the pair.
        side_a: { $ref: "#/components/schemas/ContradictionSideView" }
        side_b: { $ref: "#/components/schemas/ContradictionSideView" }

    ContradictionSideView:
      type: object
      required: [segment_sequence, quote, start_ms, end_ms]
      properties:
        segment_sequence: { type: integer }
        quote: { type: string }
        start_ms: { type: integer }
        end_ms: { type: integer }

    CompetencyResultView:
      type: object
      required: [competency_id, status, confidence, evidence_count,
                 supporting, contradictory, unverified, gaps, evidence_ids,
                 reason_codes]
      properties:
        competency_id: { type: string }
        status:
          type: string
          enum: [assessed, unassessed]
          description: Unassessed is its own outcome, never a low band.
        confidence:
          type: string
          enum: [high, medium, low, not_assessable]
          description: |
            Evidence sufficiency by the pinned rubric's own rules
            (ADR-0015). Not a probability, not comparable across roles or
            rubric versions, never a ranking.
        evidence_ids:
          type: array
          items: { type: string }
          description: The stored evidence spans this result aggregated.
        band:
          type: string
          description: Present only when status is assessed.
        evidence_count: { type: integer }
        supporting: { type: integer }
        contradictory: { type: integer }
        unverified: { type: integer }
        gaps: { type: integer }
        reason_codes:
          type: array
          items: { type: string }

    TranscriptView:
      type: object
      required: [segments, orphan_corrections]
      properties:
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        orphan_corrections:
          type: array
          items: { type: integer }
          description: Corrections whose target has not arrived; a resend is owed.

    TranscriptSegment:
      type: object
      required: [epoch, sequence, type, speaker, text, start_ms, end_ms, confidence, superseded]
      properties:
        epoch: { type: integer }
        sequence: { type: integer }
        type:
          type: string
          enum: [transcript.segment.final, transcript.segment.corrected]
        speaker:
          type: string
          enum: [candidate, interviewer]
        text: { type: string }
        start_ms: { type: integer }
        end_ms: { type: integer }
        confidence: { type: number }
        words:
          type: array
          items:
            type: object
            required: [w, start_ms, end_ms, confidence]
            properties:
              w: { type: string }
              start_ms: { type: integer }
              end_ms: { type: integer }
              confidence: { type: number }
        superseded:
          type: boolean
          description: True when a correction replaced this text. The row stands.
        corrected_by_sequence: { type: integer }
        supersedes: { type: integer }
        redo_session_id:
          type: string
          format: uuid
          description: |
            The retake session for this answer, when one exists. The retake
            is scored in its own session; this segment stays exactly as it
            was said and scored here.

    ControlEvent:
      type: object
      required: [event_id, sequence, type, occurred_at]
      properties:
        event_id: { type: string, format: uuid }
        sequence:
          type: integer
          description: Orders within the epoch. Zero for ephemeral types.
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }

    InterviewBrief:
      type: object
      required: [session_id, minutes, persona, role, plan]
      properties:
        session_id: { type: string, format: uuid }
        minutes: { type: integer }
        persona:
          type: object
          required: [name, style, description]
          properties:
            name: { type: string }
            style: { type: string }
            description: { type: string }
        role:
          type: object
          required: [title, competencies]
          properties:
            title: { type: string }
            competencies:
              type: array
              items: { type: string }
        plan:
          type: object
          additionalProperties: true
          description: The pinned plan body, exactly as composed against.
        redo_of:
          type: object
          description: "Present for a retake: ask exactly this question, once."
          required: [session_id, sequence, question]
          properties:
            session_id: { type: string, format: uuid }
            sequence: { type: integer }
            question: { type: string }

    ServiceEventBatch:
      type: object
      required: [candidate_id, mode, events]
      properties:
        candidate_id:
          type: string
          format: uuid
          description: The room participant the agent is speaking with.
        mode:
          type: string
          enum: [practice, screening]
        events:
          type: array
          items:
            type: object
            required: [event_id, type, occurred_at]
            properties:
              event_id: { type: string, format: uuid }
              type: { type: string }
              payload:
                type: object
                additionalProperties: true
              occurred_at: { type: string, format: date-time }

    ControlEventBatch:
      type: object
      required: [connection_epoch, events]
      properties:
        connection_epoch: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/ControlEvent" }

    ControlAcknowledgment:
      type: object
      required: [connection_epoch, accepted_sequence, missing, outcomes]
      properties:
        connection_epoch: { type: integer }
        accepted_sequence:
          type: integer
          description: Highest contiguous sequence durably held.
        missing:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer }
              to: { type: integer }
        outcomes:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id: { type: string, format: uuid }
              status:
                type: string
                enum: [accepted, duplicate, refused]
              reason: { type: string }

    ControlEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
            required: [event_id, connection_epoch, sequence, type, payload, occurred_at]
            properties:
              event_id: { type: string, format: uuid }
              connection_epoch: { type: integer }
              sequence: { type: integer }
              type: { type: string }
              payload:
                type: object
                additionalProperties: true
              occurred_at: { type: string, format: date-time }

    StartedInterview:
      type: object
      required: [session, realtime, timing]
      properties:
        session:
          $ref: "#/components/schemas/InterviewSession"
        realtime:
          $ref: "#/components/schemas/RoomGrant"
        timing:
          $ref: "#/components/schemas/TimingPolicyView"

    ResumedInterview:
      type: object
      description: |
        The resume command's answer. The session already carries the new
        epoch; recovery says what the previous epoch durably holds, so
        the client can resend exactly what is missing and replay the
        rest instead of pretending its own buffer is the record.
      required: [session, realtime, timing, recovery]
      properties:
        session:
          $ref: "#/components/schemas/InterviewSession"
        realtime:
          $ref: "#/components/schemas/RoomGrant"
        timing:
          $ref: "#/components/schemas/TimingPolicyView"
        recovery:
          type: object
          required: [previous_epoch, accepted_sequence, missing]
          properties:
            previous_epoch:
              type: integer
              description: |
                The epoch that was superseded; zero when the first
                attempt died before opening.
            accepted_sequence:
              type: integer
              description: Highest contiguous sequence the previous epoch durably holds.
            missing:
              type: array
              description: Gaps under the previous epoch's highest stored sequence, for the client to resend.
              items:
                type: object
                required: [from, to]
                properties:
                  from: { type: integer }
                  to: { type: integer }

    TimingPolicyView:
      type: object
      description: |
        The timing rules stamped on this session at start, versioned in
        the database and served here so no grace window or ceiling is
        ever a constant compiled into a client. Reconnecting does not
        consume interview time.
      required: [policy_version, reconnect_grace_seconds, max_overrun_seconds]
      properties:
        policy_version: { type: integer }
        reconnect_grace_seconds: { type: integer }
        max_overrun_seconds: { type: integer }

    RoomGrant:
      type: object
      description: |
        Short-lived, scoped to one room and one identity, never reusable
        across attempts: reconnection mints a fresh grant. The browser
        presents it to the SFU and holds no durable media credential.
      required: [url, room, token, expires_at]
      properties:
        url: { type: string }
        room: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }

    CreateInterviewRequest:
      type: object
      required: [mode, discipline, role, shape, minutes, persona, recording]
      properties:
        mode:
          type: string
          enum: [practice]
          description: |
            Only practice. A screening interview is created by a recruiter
            through campaign endpoints; this enum is the refusal.
        discipline: { type: string }
        role: { type: string }
        shape: { type: string }
        minutes: { type: integer }
        persona: { type: string }
        recording:
          $ref: "#/components/schemas/RecordingConsent"

    RecordingConsent:
      type: object
      description: |
        What the session keeps, and which consent text the choice was made
        against. The version must be the currently published one; a stale
        version is refused so nobody consents to words they were not shown.
      required: [preference, consent_version]
      properties:
        preference:
          type: string
          enum: [audio_and_transcript, transcript_only]
        consent_version: { type: string }

    PracticeConsent:
      type: object
      required: [version, title, statements, choices]
      properties:
        version: { type: string }
        title: { type: string }
        statements:
          type: array
          items: { type: string }
        choices:
          type: object
          required: [audio_and_transcript, transcript_only]
          properties:
            audio_and_transcript:
              $ref: "#/components/schemas/ConsentChoice"
            transcript_only:
              $ref: "#/components/schemas/ConsentChoice"

    ConsentChoice:
      type: object
      required: [label, explanation]
      properties:
        label: { type: string }
        explanation: { type: string }
        forfeits:
          type: array
          items: { type: string }
          description: What choosing this visibly costs. Named, never implied.

    InterviewSession:
      type: object
      required: [id, mode, state, config, recording_preference, consent_version, created_at]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [practice, screening] }
        state:
          type: string
          description: The lifecycle state, from session-lifecycle.md.
        config:
          $ref: "#/components/schemas/InterviewConfig"
        recording_preference:
          type: string
          enum: [audio_and_transcript, transcript_only]
        consent_version:
          type: string
          description: The consent text version the preference was chosen against.
        failure_code:
          type: string
          description: The stable refusal code, present in a *_failed state.
        cursor:
          type: object
          description: |
            Where the durable timeline stands: the current connection epoch
            and the highest contiguous accepted sequence. What completion
            seals at.
          required: [connection_epoch, accepted_sequence]
          properties:
            connection_epoch: { type: integer }
            accepted_sequence: { type: integer }
        redo_of:
          type: object
          description: Present when this session is a retake of one answer.
          required: [session_id, sequence, question]
          properties:
            session_id: { type: string, format: uuid }
            sequence: { type: integer }
            question: { type: string }
        seal:
          type: object
          description: |
            The completion receipt, durable: present once the session has
            sealed, identical however often it is read.
          required: [sealed_at, media_status, warnings]
          properties:
            sealed_at: { type: string, format: date-time }
            media_status:
              type: string
              enum: [finalized, missing, none_by_choice]
            warnings:
              type: array
              items: { type: string }
        created_at: { type: string, format: date-time }

    InterviewConfig:
      type: object
      required: [discipline, role, shape, minutes, persona]
      properties:
        discipline: { type: string }
        role: { type: string }
        shape: { type: string }
        minutes: { type: integer }
        persona: { type: string }

    Discipline:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DisciplineList:
      type: object
      required: [disciplines]
      properties:
        disciplines:
          type: array
          items: { $ref: "#/components/schemas/Discipline" }

    CatalogRole:
      type: object
      required: [id, discipline, title, organisation, competencies, shapes]
      properties:
        id: { type: string }
        discipline: { type: string }
        title: { type: string }
        organisation: { type: string }
        competencies:
          type: array
          items: { type: string }
        shapes:
          type: array
          items: { type: string }
          description: The interview shapes this role offers; the combination rule.

    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/CatalogRole" }

    InterviewShape:
      type: object
      required: [id, name, description, minutes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        minutes:
          type: array
          items: { type: integer }
          description: The lengths this shape can honestly run at.

    ShapeList:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          items: { $ref: "#/components/schemas/InterviewShape" }

    Persona:
      type: object
      required: [id, name, style, voice, description, best_for, shapes]
      properties:
        id: { type: string }
        name: { type: string }
        style: { type: string }
        voice: { type: string }
        description: { type: string }
        best_for: { type: string }
        shapes:
          type: array
          items: { type: string }
          description: The shapes this persona runs. Empty means unrestricted.

    PersonaList:
      type: object
      required: [personas]
      properties:
        personas:
          type: array
          items: { $ref: "#/components/schemas/Persona" }

    Fact:
      type: object
      description: |
        One thing extraction read, with its provenance. The value is what the
        extractor produced and is never rewritten; corrected_value is the
        candidate's version, present exactly while status is corrected.
      required:
        [id, document_id, kind, value, span_start, span_end, confidence,
         extractor_version, status, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [role, skill, date_range, achievement, unparsed]
        value:
          type: object
          additionalProperties: true
          description: The extracted value, shaped per kind.
        corrected_value:
          type: object
          additionalProperties: true
          description: The candidate's version, only while corrected.
        span_start:
          type: integer
          minimum: 0
          description: Half-open source range, in characters of the extracted text.
        span_end: { type: integer, minimum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        extractor_version: { type: string }
        status:
          type: string
          enum: [proposed, confirmed, corrected, rejected]
        created_at: { type: string, format: date-time }
        reviewed_at:
          type: string
          format: date-time
          description: When the candidate last acted. Absent while proposed.

    FactList:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items: { $ref: "#/components/schemas/Fact" }

    ReviewFactRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, corrected, rejected]
          description: proposed is the pipeline's word, not a move.
        corrected_value:
          type: object
          additionalProperties: true
          description: Required when status is corrected, refused otherwise.

    StartUploadRequest:
      type: object
      required: [media_type, size_bytes, part_count]
      properties:
        media_type:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
        part_count: { type: integer, minimum: 1, maximum: 4 }

    StartedUpload:
      type: object
      description: What the browser needs to carry the bytes itself.
      required: [document, upload_id, part_urls, expires_at]
      properties:
        document: { $ref: "#/components/schemas/Document" }
        upload_id: { type: string }
        part_urls:
          type: array
          items: { type: string }
          description: Presigned PUT URLs, one per part, in part order.
        expires_at:
          type: string
          format: date-time
          description: When the URLs stop working, shown rather than discovered.

    CompleteUploadRequest:
      type: object
      required: [upload_id, sha256, size_bytes, parts]
      properties:
        upload_id: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        parts:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [number, etag]
            properties:
              number: { type: integer, minimum: 1 }
              etag: { type: string }

    CandidateProfile:
      type: object
      description: |
        The candidate's own profile. Every field is optional, and absent
        arrays serialise as empty: a partial profile is a profile.
      required:
        [disciplines, target_roles, extended_time, captions, reduced_motion,
         notify_product_updates, notify_practice_reminders]
      properties:
        disciplines:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
          description: What they practise for, in their own words until the catalogue exists.
        target_roles:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        seniority:
          type: string
          maxLength: 80
        career_context:
          type: string
          maxLength: 4000
          description: Their own account of where they are and where they are going.
        default_duration_minutes:
          type: integer
          minimum: 10
          maximum: 90
          description: Applied when creating a practice session; overridable there.
        default_style:
          type: string
          maxLength: 80
        default_pressure:
          type: string
          enum: [low, standard, high]
        extended_time:
          type: boolean
          description: Accessibility preference the prepare and live screens honour by default.
        captions:
          type: boolean
        reduced_motion:
          type: boolean
        accessibility_notes:
          type: string
          maxLength: 2000
        notify_product_updates:
          type: boolean
        notify_practice_reminders:
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, account_type]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Hashed with argon2id and never logged. The maximum is not a strength
            policy: argon2 hashes whatever it is given, so an unbounded input is
            a denial of service.
        account_type:
          type: string
          enum: [candidate, organisation]
          description: |
            A candidate registers for themselves. An organisation registration
            additionally creates a tenant and an owning membership.
        organisation_name:
          type: string
          maxLength: 200
          description: Required when account_type is organisation.

    RegistrationAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [verification_sent]
          description: |
            Returned whether or not the address was already registered. The
            response is deliberately uninformative about which.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    Session:
      type: object
      description: |
        Describes the session that was established. The tokens themselves are
        in HTTP-only cookies and never appear in a response body, so no script
        in the page can read them.
      required: [user_id, expires_at, authenticated_at]
      properties:
        user_id:
          type: string
          format: uuid
        active_tenant_id:
          type: [string, "null"]
          format: uuid
          description: |
            Null for a candidate who belongs to no tenant. Every request
            operates under exactly one explicit active tenant, and it is never
            inferred from a resource identifier.
        expires_at:
          type: string
          format: date-time
        authenticated_at:
          type: string
          format: date-time
          description: |
            When the user last proved who they are, which is not when the
            session was issued. Destructive and evaluation-changing capabilities
            require this to be recent.

    MembershipList:
      type: object
      additionalProperties: false
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    ActiveTenantSelection:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: |
            The workspace to act under, or null to act under none.

    Membership:
      type: object
      required: [tenant_id, tenant_name, status]
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        status:
          type: string
          enum: [invited, active, revoked]

    CurrentUser:
      type: object
      required: [user_id, email_verified, memberships, capabilities]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        active_tenant_id:
          type: [string, "null"]
          format: uuid
        memberships:
          type: array
          description: |
            A user may belong to several tenants. The interface lets them switch,
            and the server decides what each membership permits.
          items:
            $ref: "#/components/schemas/Membership"
        capabilities:
          type: array
          description: |
            What this session may do under its active tenant. The set changes
            when the active tenant changes, and is empty for somebody who has
            not chosen one and belongs to no workspace.

            Present so an interface can avoid offering a control that will
            refuse the person using it. Rendering is never what stops access:
            every request is authorised on the server against the same
            capabilities, and one for something not held is denied whether or
            not anything was drawn.

            Names come from the capability catalogue in
            packages/contracts/authz/capabilities.yaml, which generates both
            the server's constants and the browser's.
          items:
            type: string
            description: A capability name, such as campaign.read.

security:
  - sessionCookie: []
