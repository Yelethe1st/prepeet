# The capability catalogue.
#
# This document is the source. The Go constants and the TypeScript names are
# generated from it, so a capability cannot exist in one language and not
# another, and a requirement cannot be changed in code without changing the
# contract that describes it.
#
# It is published rather than kept in code for the reason ADR-0004 gives for the
# API contract: much of what is here is a compliance obligation rather than an
# implementation detail. Which authority reaches a candidate's practice history,
# what needs recent authentication, and what needs an elevation with a ticket
# are questions legal and security have to be able to answer from one artifact
# without reading Go.
#
# Every entry carries the reason for its requirements. A requirement without one
# is a rule nobody can review, and the reason is what a future change has to
# argue against.
#
# Names describe authority over a resource, never an interface element. A
# capability named after a screen would have to change when the screen is
# renamed, and the two have no reason to move together.

version: 1

# What a capability can require beyond being held.
requirements:
  tenant: Exercised inside one tenant. The request must name the tenant the subject is active in.
  scope: >-
    Tenant membership is not enough. The subject needs an explicit assignment
    covering the resource, and a scoped capability asked without a scope is
    denied, so a list endpoint cannot return everything by declining to mention
    one.
  owner: Applies to the subject's own data only, and is never satisfied by tenant authority.
  platform: Belongs to platform authority, which is separate from tenant authority rather than above it.
  privileged: Requires an active elevation carrying a reason and a ticket.
  step_up: >-
    Destructive, or changes how a candidate is evaluated. Requires recent
    authentication rather than a session opened this morning.

# The scope dimensions a capability can be scoped along.
scopes:
  - campaign
  - role

capabilities:

  # ── A candidate's own data
  # Owner capabilities. No tenant authority satisfies any of these,
  # structurally rather than by filtering: an employer seeing rehearsals a
  # candidate believed were private is the failure this product cannot have.

  - name: candidate.practice.delete_own
    owner: true
    step_up: true
    reason: >-
      Deleting practice history is irreversible, so it needs recent
      authentication rather than a session opened this morning.

  - name: candidate.practice.read_own
    owner: true
    reason: >-
      Practice history is the candidate's alone. This is the capability that
      makes practice private, and no tenant authority satisfies it.

  - name: candidate.profile.read_own
    owner: true
    reason: >-
      A candidate's own profile. Owner rather than tenant, because an
      employer must never reach it.

  - name: candidate.profile.write_own
    owner: true
    reason: >-
      Only the candidate edits their own profile. Nobody edits it on their
      behalf.

  # ── Taking part in an interview
  # Held by the person in the interview.

  - name: session.accept_invitation
    owner: true
    reason: >-
      Accepting a screening invitation is the candidate's decision and
      nobody else's.

  - name: session.create_practice
    owner: true
    reason: >-
      A candidate starts their own practice session. Owner, because a
      recruiter starting one on somebody's behalf would be practice data an
      employer produced.

  - name: session.participate
    owner: true
    reason: >-
      Being in the interview. Owner, because participation is by the person
      invited.

  - name: session.read_own_practice
    owner: true
    reason: >-
      Reading one's own practice session.

  - name: session.read_screen_confirmation
    owner: true
    reason: >-
      A candidate may see that their screening interview completed. What the
      employer saw is a different capability.

  # ── Recruiting inside one tenant
  # Tenant capabilities. Membership of a tenant is not authority over every
  # campaign in it, so the ones that change something are scoped.

  - name: campaign.manage
    tenant: true
    scope: campaign
    reason: >-
      Changing a campaign needs an explicit assignment to it. Tenant
      membership is not authority over every campaign in the tenant.

  - name: campaign.read
    tenant: true
    reason: >-
      Reading campaigns inside one tenant. Unscoped, because a recruiter may
      see which campaigns exist before being assigned to one.

  - name: invitation.manage
    tenant: true
    reason: >-
      Issuing or revoking an invitation affects a candidate's access, so it
      is scoped to the campaign rather than to the tenant.

  - name: invitation.read
    tenant: true
    reason: >-
      Reading invitations for a campaign the recruiter is assigned to.

  - name: evaluation.compare
    tenant: true
    scope: campaign
    reason: >-
      Comparing candidates. Scoped and step-up: comparison is off by default
      under responsible-hiring.md and is the most consequential thing a
      recruiter can do.

  - name: evaluation.read_screen
    tenant: true
    scope: campaign
    reason: >-
      Reading a screening evaluation. Scoped, because an evaluation belongs
      to a campaign and not to everyone in the tenant.

  - name: evaluation.review
    tenant: true
    scope: campaign
    reason: >-
      Recording a human review of an evaluation. Step-up, because it changes
      how a candidate is assessed.

  - name: appeal.raise
    tenant: true
    scope: campaign
    reason: >-
      Raising a re-review of an evaluation. Asking the question is separate
      from answering it: anyone doing the recruiting work can flag an
      evaluation they can already read, and appeal.manage decides what
      happens to it.

  - name: appeal.manage
    tenant: true
    scope: campaign
    reason: >-
      Handling a candidate's appeal against an evaluation, resolving a
      re-review included. Wider than raising one, because changing an
      evaluation's standing answers for the workspace.

  # ── Tenant configuration
  # Held by a tenant administrator.

  - name: rubric.draft
    tenant: true
    reason: >-
      Drafting a rubric. Unpublished drafts change nothing.

  - name: rubric.publish
    tenant: true
    step_up: true
    reason: >-
      Publishing a rubric changes how every future candidate is evaluated,
      so it needs recent authentication.

  - name: rubric.read
    tenant: true
    reason: >-
      Reading the tenant's rubric library.

  - name: tenant.billing_read
    tenant: true
    reason: >-
      Reading billing and usage.

  - name: tenant.integration_manage
    tenant: true
    step_up: true
    reason: >-
      Integrations move candidate data to systems outside Prepeet, so this
      needs recent authentication.

  - name: tenant.member_read
    tenant: true
    reason: >-
      Seeing who belongs to the workspace, with each person's role. Every
      membership role holds it, because a colleague list is not authority
      over anyone and hiding it only obscures who to ask for access.

  - name: tenant.member_manage
    tenant: true
    step_up: true
    reason: >-
      Adding or removing members changes who can see candidate evidence, so
      it needs recent authentication.

  - name: tenant.retention_manage
    tenant: true
    step_up: true
    reason: >-
      Retention determines when candidate data is destroyed, which is
      irreversible.

  - name: tenant.settings_manage
    tenant: true
    reason: >-
      Tenant configuration.

  # ── Platform authority
  # Separate authority, never a superset of tenant authority. Holding a
  # platform capability grants nothing inside any tenant.

  - name: content.artifact_draft
    platform: true
    reason: >-
      Drafting a platform artifact - a persona, prompt, rubric or policy.
      Platform authority because these shape every tenant's interviews; a
      draft changes nothing until somebody else publishes it.

  - name: content.artifact_publish
    platform: true
    step_up: true
    reason: >-
      Publishing changes how every future candidate is evaluated, which is
      the definition of what step-up exists for. ADR-0011 adds the structural
      half: the registry refuses a publish whose actor drafted the version,
      so this capability alone is never sufficient for one person to ship
      their own artifact.

  - name: content.artifact_rollback
    platform: true
    step_up: true
    reason: >-
      Rolling back repoints the current version to an earlier publication.
      Step-up for publishing's reason, and it is its own capability rather
      than publish reused, because who may react to a bad artifact is a
      different and usually wider question than who may ship one.

  - name: platform.analytics_read
    platform: true
    reason: >-
      Aggregate platform analytics. Platform authority, which is separate
      from tenant authority rather than a superset of it.

  - name: platform.audit_read
    platform: true
    privileged: true
    reason: >-
      Reading the audit trail, which is itself an auditable act.

  - name: platform.operations_execute
    platform: true
    privileged: true
    reason: >-
      Running an operational action. Privileged: it needs an active
      elevation carrying a reason and a ticket.

  - name: platform.operations_read
    platform: true
    reason: >-
      Reading operational state across the platform.

  - name: platform.privileged_elevate
    platform: true
    step_up: true
    reason: >-
      Requesting elevation. Privileged and step-up, because it is the gate
      every other privileged action passes through.

  - name: platform.quota_manage
    platform: true
    privileged: true
    step_up: true
    reason: >-
      Changing a tenant's quota.

# ─────────────────────────────────────────────────────────────── roles
#
# A role is a bundle of capabilities, never a check of its own. Nothing in the
# product asks "is this person an owner"; it asks whether they hold a capability,
# and a role is only how they came to hold it. That is the difference that lets
# the role model change without every call site changing with it.
#
# Two roles, matching the two values migration 0006 allows. The full matrix is
# TEN-02's, and these are deliberately the minimum that makes the interface
# possible: somebody who created a workspace must be able to administer it, and
# somebody invited to one must be able to do the work.
#
# `candidate` is not a membership. It is what somebody holds when they belong to
# no tenant at all, which is every candidate practising alone, and it is listed
# here so that "what can this person do" has one answer rather than a special
# case.
#
# Holding a capability is not the same as being able to exercise it. A scoped
# capability still needs an assignment covering the resource, so campaign.manage
# in a bundle grants nothing until somebody is assigned to a campaign. That is
# why the bundles can be generous without being permissive.

roles:
  - name: candidate
    membership: false
    reason: >-
      What somebody holds with no tenant membership. Every capability here is
      owner-scoped, so it reaches that person's own data and nothing else. No
      tenant authority can satisfy any of them, which is what keeps practice
      private from employers.
    capabilities:
      - candidate.profile.read_own
      - candidate.profile.write_own
      - candidate.practice.read_own
      - candidate.practice.delete_own
      - session.create_practice
      - session.accept_invitation
      - session.participate
      - session.read_own_practice
      - session.read_screen_confirmation

  # The tenant role vocabulary is TEN-02's, taken from the prototype's own
  # permission matrix: recruiter, hiring manager, tenant admin and read-only,
  # beside the owner that IAM-01 anchored to whoever created the workspace.
  # Every scoped capability in these bundles still needs an assignment
  # covering the resource, so a recruiter's generous-looking bundle grants
  # nothing outside the campaigns they are scoped to.

  - name: recruiter
    membership: true
    reason: >-
      Somebody invited to a workspace to do the recruiting work. They can see
      what exists and act on the campaigns they are assigned to, raise a
      re-review but not resolve one, and they cannot change how the workspace
      itself is configured.
    capabilities:
      - campaign.read
      - campaign.manage
      - invitation.read
      - invitation.manage
      - evaluation.read_screen
      - evaluation.review
      - appeal.raise
      - tenant.member_read
      - rubric.read

  - name: hiring_manager
    membership: true
    reason: >-
      A recruiter who additionally answers for outcomes: everything the
      recruiting work needs, plus resolving the re-reviews recruiters raise.
      Still scoped, still no workspace configuration.
    capabilities:
      - campaign.read
      - campaign.manage
      - invitation.read
      - invitation.manage
      - evaluation.read_screen
      - evaluation.review
      - appeal.raise
      - appeal.manage
      - tenant.member_read
      - rubric.read

  - name: viewer
    membership: true
    reason: >-
      Read-only. Can see campaigns, invitations and the evaluations they are
      scoped to, and cannot record a decision, send an invitation or change
      anything - the role for oversight without authority.
    capabilities:
      - campaign.read
      - invitation.read
      - evaluation.read_screen
      - tenant.member_read
      - rubric.read

  - name: admin
    membership: true
    reason: >-
      The tenant administrator: full access to every candidate in the
      workspace and to all configuration - rubrics, members, integrations,
      retention and billing. Granted sparingly, and identical in capability
      to owner: what distinguishes an owner is being anchored to the
      workspace's creation, not holding more.
    capabilities:
      - campaign.read
      - campaign.manage
      - invitation.read
      - invitation.manage
      - evaluation.read_screen
      - evaluation.review
      - appeal.raise
      - appeal.manage
      - tenant.member_read
      - rubric.read
      - rubric.draft
      - rubric.publish
      - tenant.member_manage
      - tenant.settings_manage
      - tenant.retention_manage
      - tenant.billing_read
      - tenant.integration_manage

  - name: owner
    membership: true
    reason: >-
      Whoever created the workspace, and anybody they make an owner. The same
      capabilities as admin; the anchor exists so a workspace always has an
      administrator nobody inside it can remove.
    capabilities:
      - campaign.read
      - campaign.manage
      - invitation.read
      - invitation.manage
      - evaluation.read_screen
      - evaluation.review
      - appeal.raise
      - appeal.manage
      - tenant.member_read
      - rubric.read
      - rubric.draft
      - rubric.publish
      - tenant.member_manage
      - tenant.settings_manage
      - tenant.retention_manage
      - tenant.billing_read
      - tenant.integration_manage

# Deliberately in no bundle, each for its own reason.
#
# evaluation.compare is off by default under responsible-hiring.md and whether it
# ships at all is DEC-17. Putting it in a bundle would turn it on for every
# workspace by default, which is the opposite of what that decision says.
#
# Every platform.* capability, because platform authority is separate from tenant
# authority rather than a senior form of it. A tenant role that granted one would
# make the owner of any workspace a member of platform staff.
unbundled:
  - content.artifact_draft
  - content.artifact_publish
  - content.artifact_rollback
  - evaluation.compare
  - platform.analytics_read
  - platform.audit_read
  - platform.operations_read
  - platform.operations_execute
  - platform.quota_manage
  - platform.privileged_elevate
