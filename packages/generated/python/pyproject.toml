# The generated Python contracts, as an installable package.
#
# Never edited by hand and never versioned independently: `make generate`
# rewrites the modules from packages/contracts, and consumers depend on this
# by path, so the contract a process imports is always the one in its own
# checkout. This file exists because pytest's pythonpath made the modules
# importable in tests while nothing made them importable in production, which
# a Go-to-Python integration test discovered by the server failing to start.
[project]
name = "prepeet-contracts-generated"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["protobuf>=5.28", "grpcio>=1.68"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prepeet"]
