[project]
name = "prepeet-intelligence"
version = "0.1.0"
description = "Typed intelligence for Prepeet: composition, evaluation, articulation and coaching."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    # The RPC surface. grpcio serves it, protobuf decodes it; both sides of the
    # contract in packages/contracts/rpc depend on these at runtime.
    "grpcio>=1.68",
    "grpcio-status>=1.83.0",
    "livekit>=1.0",
    "livekit-agents>=1.0",
    "openai>=1.50",
    "prepeet-contracts-generated",
    "protobuf>=5.28",
    # Tracing. PLT-08 needs one trace across the whole journey, and this plane
    # was the widest gap in it: the Go worker sends W3C trace context on every
    # call and nothing here could read it, so the slowest work in the product
    # was invisible from the request that caused it.
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    # Generates the Python gRPC service stub in make generate. A build-time
    # dependency only: the service imports the generated code, not the tool.
    "grpcio-tools>=1.68",
    # Issues throwaway certificate authorities so the transport's TLS can be
    # tested by actually completing a handshake. Asserting on the arguments
    # passed to grpc would prove only that the call was made with the shape
    # the test expected, which is the thing already believed.
    "trustme>=1.1",
]
voice = [
    "livekit-plugins-cartesia>=1.0",
    "livekit-plugins-deepgram>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepeet_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Strict markers and strict config turn a typo in a decorator or a setting into
# an error rather than a silently skipped test.
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["prepeet_ai"]
branch = true

[tool.coverage.report]
# A partially covered branch is an untested decision, and this service makes
# decisions about people's evaluations.
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = [
    "D203",  # incompatible with D211, which we keep
    "D213",  # incompatible with D212, which we keep
]

[tool.ruff.lint.per-file-ignores]
# Test names document the behaviour they assert, so a docstring on every test
# would duplicate the name rather than add anything.
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Go validates everything this service returns, but an untyped boundary here
# means the validation is the first place a mistake is noticed.
disallow_any_explicit = false

[tool.uv.sources]
prepeet-contracts-generated = { path = "../../packages/generated/python", editable = true }

[dependency-groups]
dev = [
    "types-grpcio>=1.83.0.20260730",
    "types-protobuf>=7.35.1.20260825",
]

# The generated contracts ship .pyi stubs for messages but not the py.typed
# marker, and the grpc-status ecosystem publishes no stubs at all. Overridden
# per module rather than globally, so a genuinely untyped import elsewhere
# still fails the gate.
[[tool.mypy.overrides]]
module = ["grpc_status.*", "google.rpc.*", "prepeet.*"]
ignore_missing_imports = true
